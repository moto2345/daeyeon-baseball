<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선수 프로필 | 대연초 야구부</title>
    <!-- 구글 시트 CSV 연동 주소 -->
    <script>
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSw2YtYByfiPWXbRfqkzmZ6yzaZVfJHO0f9zAmCiLnwlMvVXCt9lv4AmQAz4_vSjzPy0APtl0hwYNmW/pub?output=csv";
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        :root {
            --kbo-blue: #0b2240;
            --kbo-sub-blue: #163868;
            --kbo-red: #c8102e;
            --bg-gray: #f4f6f9;
            --card-border: #e2e8f0;
            --text-title: #0f172a;
            --text-sub: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-gray);
            color: var(--text-title);
            padding-bottom: 60px;
        }

        /* 상단 헤더 */
        header {
            background-color: var(--kbo-blue);
            color: white;
            padding: 20px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 4px solid var(--kbo-red);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-back {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: 0.15s;
        }

        .btn-back:hover {
            background: rgba(255,255,255,0.25);
        }

        .header-title {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .container {
            max-width: 600px;
            margin: 24px auto 0;
            padding: 0 16px;
        }

        /* 프로필 카드 */
        .profile-card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
        }

        /* 사진 영역 */
        .profile-photo-wrap {
            width: 100%;
            height: 320px;
            background: #e2e8f0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            display: block;
        }

        .profile-no-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            background: rgba(11, 34, 64, 0.95);
            color: #ffffff;
            font-size: 18px;
            font-weight: 900;
            padding: 4px 12px;
            border-radius: 8px;
            font-family: "Impact", sans-serif;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
        }

        .profile-pos-badge {
            position: absolute;
            top: 14px;
            right: 14px;
        }

        /* 뱃지 스타일 */
        .grade-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }
        .grade-staff { background: #0f172a; color: #ffffff; }
        .grade-6 { background: #fee2e2; color: #991b1b; }
        .grade-5 { background: #fef3c7; color: #92400e; }
        .grade-4 { background: #e0e7ff; color: #3730a3; }
        .grade-3 { background: #dcfce7; color: #166534; }
        .grade-2 { background: #f3e8ff; color: #6b21a8; }
        .grade-1 { background: #e0f2fe; color: #0369a1; }

        .pos-tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 800;
            color: #ffffff;
        }
        .pos-staff-leader { background: #b45309; }
        .pos-staff-coach { background: #475569; }
        .pos-투수 { background: #c2410c; }
        .pos-포수 { background: #0f766e; }
        .pos-내야수 { background: #1d4ed8; }
        .pos-외야수 { background: #15803d; }
        .pos-기타 { background: #64748b; }

        /* 정보 영역 */
        .profile-body {
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .name-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--card-border);
        }

        .player-name {
            font-size: 24px;
            font-weight: 900;
            color: var(--text-title);
            letter-spacing: -0.5px;
        }

        /* 상세 스펙 테이블 */
        .spec-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .spec-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            padding: 10px 14px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #edf2f7;
        }

        .spec-label {
            font-weight: 700;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .spec-value {
            font-weight: 800;
            color: var(--text-title);
        }

        .text-private {
            color: #94a3b8;
            font-weight: 700;
        }

        /* 로딩 & 에러 안내 */
        .status-box {
            background: #ffffff;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            color: var(--text-sub);
            font-size: 15px;
            font-weight: 600;
            border: 1px solid var(--card-border);
        }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <a href="index.html" class="btn-back">← 목록으로</a>
        <div class="header-title">선수 상세 프로필</div>
    </div>
</header>

<div class="container">
    <div id="statusNotice" class="status-box">선수 정보를 불러오고 있습니다...</div>
    <div id="profileCard" class="profile-card" style="display: none;"></div>
</div>

<script>
    const defaultAvatar = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23e2e8f0'/%3E%3Cpath d='M32 32 C32 18 42 12 50 12 C58 12 68 18 68 32 C68 40 58 48 50 48 C42 48 32 40 32 32 Z' fill='%2394a3b8'/%3E%3Cpath d='M44 14 C48 10 56 10 65 14 C74 18 84 18 86 21 C86 24 75 25 65 24 Z' fill='%230b2240'/%3E%3Cpath d='M20 92 C20 66 34 56 50 56 C66 56 80 66 80 92 Z' fill='%2364748b'/%3E%3C/svg%3E";

    function handleImgError(el) {
        el.onerror = null;
        el.src = defaultAvatar;
    }

    function isStaff(grade) {
        return grade === '감독' || grade === '코치';
    }

    function getGradeBadge(grade) {
        if (isStaff(grade)) return `<span class="grade-tag grade-staff">${grade}</span>`;
        return `<span class="grade-tag grade-${grade}">${grade}학년</span>`;
    }

    function getPosBadge(pos, grade) {
        if (!pos || pos === '-') return '';
        if (grade === '감독') return `<span class="pos-tag pos-staff-leader">${pos}</span>`;
        if (grade === '코치') return `<span class="pos-tag pos-staff-coach">${pos}</span>`;
        return `<span class="pos-tag pos-${pos}">${pos}</span>`;
    }

    // URL 파라미터에서 등번호 추출 (예: ?path=5/2 -> 2, ?path=staff/70 -> 70, ?no=2 -> 2)
    function getTargetNumber() {
        const urlParams = new URLSearchParams(window.location.search);
        let target = urlParams.get('no');
        const path = urlParams.get('path');
        if (path) {
            const parts = path.split('/');
            target = parts[parts.length - 1];
        }
        return target ? parseInt(target, 10) : null;
    }

    async function loadPlayerDetail() {
        const targetNo = getTargetNumber();
        const notice = document.getElementById('statusNotice');
        const card = document.getElementById('profileCard');

        if (!targetNo) {
            notice.textContent = "선수 정보가 지정되지 않았습니다.";
            return;
        }

        try {
            const cacheUrl = GOOGLE_SHEET_CSV_URL + (GOOGLE_SHEET_CSV_URL.includes('?') ? '&' : '?') + 'nocache=' + new Date().getTime();
            const response = await fetch(cacheUrl);
            const csvText = await response.text();

            Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const players = results.data.map(row => ({
                        no: parseInt(row['등번호']) || 0,
                        name: (row['이름'] || '').trim(),
                        grade: (row['구분'] || '').trim(),
                        pos: (row['포지션'] || '-').trim(),
                        bt: (row['투타'] || '-').trim(),
                        birth: (row['생년월일'] || '').trim(),
                        height: (row['키'] || '').trim(),
                        weight: (row['몸무게'] || '').trim(),
                        visible: String(row['노출여부'] || '').toUpperCase().trim() !== 'OFF',
                        hidePhoto: ['O', 'Y', 'TRUE', '1'].includes(String(row['사진비공개'] || '').toUpperCase().trim()),
                        hideHeight: ['O', 'Y', 'TRUE', '1'].includes(String(row['키비공개'] || '').toUpperCase().trim()),
                        hideWeight: ['O', 'Y', 'TRUE', '1'].includes(String(row['몸무게비공개'] || '').toUpperCase().trim())
                    })).filter(p => p.no && p.name);

                    const p = players.find(item => item.no === targetNo);

                    if (!p) {
                        notice.textContent = `등번호 ${targetNo}번 선수 정보를 찾을 수 없습니다.`;
                        return;
                    }

                    // 사진 영역
                    const photoUrl = `data/photos/${p.no}.jpg`;
                    let photoHtml = '';
                    if (p.hidePhoto) {
                        photoHtml = `
                            <div class="profile-photo-wrap" style="background:#f1f5f9; flex-direction:column;">
                                <div style="font-size: 52px; opacity: 0.35;">👤</div>
                                <span style="margin-top:10px; font-size:13px; font-weight:800; color:#64748b; background:rgba(255,255,255,0.9); padding:4px 12px; border-radius:14px; border:1px solid #cbd5e1;">🔒 사진 비공개</span>
                            </div>
                        `;
                    } else {
                        photoHtml = `
                            <div class="profile-photo-wrap">
                                <img class="profile-img" src="${photoUrl}" alt="${p.name}" onerror="handleImgError(this)">
                            </div>
                        `;
                    }

                    // 체격 (신장/체중)
                    let physValue = '-';
                    if (p.height || p.weight) {
                        const hText = p.height ? (p.hideHeight ? '<span class="text-private">비공개</span>' : `${p.height}cm`) : '-';
                        const wText = p.weight ? (p.hideWeight ? '<span class="text-private">비공개</span>' : `${p.weight}kg`) : '-';
                        physValue = `${hText} / ${wText}`;
                    }

                    card.innerHTML = `
                        <div style="position: relative;">
                            ${photoHtml}
                            <span class="profile-no-badge">No.${p.no}</span>
                            <div class="profile-pos-badge">${getPosBadge(p.pos, p.grade)}</div>
                        </div>
                        <div class="profile-body">
                            <div class="name-row">
                                <div class="player-name">${p.name}</div>
                                <div>${getGradeBadge(p.grade)}</div>
                            </div>

                            <div class="spec-list">
                                <div class="spec-item">
                                    <span class="spec-label">⚾ 포지션 / 역할</span>
                                    <span class="spec-value">${p.pos}</span>
                                </div>
                                <div class="spec-item">
                                    <span class="spec-label">🧤 투 / 타</span>
                                    <span class="spec-value">${p.bt || '-'}</span>
                                </div>
                                <div class="spec-item">
                                    <span class="spec-label">🎂 생년월일</span>
                                    <span class="spec-value">${p.birth || '-'}</span>
                                </div>
                                <div class="spec-item">
                                    <span class="spec-label">📏 체격 (신장/체중)</span>
                                    <span class="spec-value">${physValue}</span>
                                </div>
                                <div class="spec-item">
                                    <span class="spec-label">🏫 소속</span>
                                    <span class="spec-value">대연초등학교 야구부</span>
                                </div>
                            </div>
                        </div>
                    `;

                    notice.style.display = 'none';
                    card.style.display = 'flex';
                    document.title = `No.${p.no} ${p.name} | 대연초 야구부`;
                }
            });
        } catch (error) {
            console.error("데이터 로드 에러:", error);
            notice.textContent = "선수 정보를 불러오는 데 실패했습니다.";
        }
    }

    loadPlayerDetail();
</script>

</body>
</html>
