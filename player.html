<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상세 프로필 - 대연초등학교 야구부</title>
    <style>
        :root {
            --kbo-blue: #0b2240;
            --kbo-sub-blue: #163868;
            --kbo-red: #c8102e;
            --bg-gray: #f4f6f9;
            --card-border: #e2e8f0;
            --text-title: #0f172a;
            --text-sub: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        }

        body {
            background-color: var(--bg-gray);
            color: var(--text-title);
            padding-bottom: 60px;
        }

        header {
            background: linear-gradient(135deg, var(--kbo-blue) 0%, #163868 100%);
            color: white;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            border-bottom: 4px solid var(--kbo-red);
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: 0.2s;
        }

        .back-btn:hover { background: rgba(255, 255, 255, 0.25); }

        .container {
            max-width: 680px;
            margin: 24px auto 0;
            padding: 0 16px;
        }

        .profile-card {
            background: #ffffff;
            border-radius: 16px;
            border: 1px solid var(--card-border);
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .profile-top {
            background: linear-gradient(180deg, #0b2240 0%, #1e3a8a 100%);
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            color: white;
        }

        .back-number-watermark {
            position: absolute;
            right: 20px;
            bottom: 0;
            font-family: "Impact", sans-serif;
            font-size: 110px;
            color: rgba(255, 255, 255, 0.08);
            line-height: 1;
            user-select: none;
        }

        .profile-img-wrap {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            background: #e2e8f0;
            overflow: hidden;
            box-shadow: 0 6px 16px rgba(0,0,0,0.25);
            margin-bottom: 14px;
            position: relative;
            z-index: 2;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
        }

        .profile-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 2;
        }

        .profile-no {
            font-family: "Impact", sans-serif;
            color: #fca5a5;
            font-size: 26px;
            letter-spacing: 0.5px;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .profile-badges {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            z-index: 2;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }
        .badge-role { background: rgba(255,255,255,0.2); color: #ffffff; }
        .badge-pos { background: var(--kbo-red); color: #ffffff; }

        .profile-body { padding: 24px 20px; }

        .info-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .info-table th {
            width: 32%;
            text-align: left;
            padding: 12px 14px;
            background: #f8fafc;
            color: #475569;
            font-weight: 700;
            border-bottom: 1px solid var(--card-border);
        }

        .info-table td {
            padding: 12px 14px;
            border-bottom: 1px solid var(--card-border);
            color: var(--text-title);
            font-weight: 600;
        }

        .message-box {
            background: #f8fafc;
            border: 1px dashed #cbd5e1;
            border-radius: 10px;
            padding: 16px;
            text-align: center;
        }

        .message-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .message-content {
            font-size: 15px;
            font-weight: 700;
            color: var(--kbo-sub-blue);
            line-height: 1.5;
        }

        .loading-box {
            text-align: center;
            padding: 80px 20px;
            font-size: 15px;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

<header>
    <div style="font-weight: 800; font-size: 15px;">⚾ 대연초 야구부 프로필</div>
    <a href="index.html" class="back-btn">← 전체 명단 보기</a>
</header>

<div class="container">
    <div id="loading" class="loading-box">선수 정보를 불러오는 중입니다...</div>

    <div id="profileCard" class="profile-card" style="display: none;">
        <div class="profile-top">
            <div id="backWatermark" class="back-number-watermark"></div>
            <div class="profile-img-wrap">
                <img id="pPhoto" class="profile-img" src="" alt="프로필 사진">
            </div>
            <div class="profile-name-row">
                <span id="pNo" class="profile-no"></span>
                <span id="pName" class="profile-name"></span>
            </div>
            <div class="profile-badges">
                <span id="pGradeBadge" class="badge badge-role"></span>
                <span id="pPosBadge" class="badge badge-pos"></span>
            </div>
        </div>

        <div class="profile-body">
            <table class="info-table">
                <tr>
                    <th>소속 팀</th>
                    <td>부산 대연초등학교 야구부</td>
                </tr>
                <tr>
                    <th>포지션 / 역할</th>
                    <td id="pPos">-</td>
                </tr>
                <tr>
                    <th>투/타 유형</th>
                    <td id="pBt">-</td>
                </tr>
                <tr>
                    <th>생년월일</th>
                    <td id="pBirth">-</td>
                </tr>
                <tr>
                    <th>신장 / 체중</th>
                    <td id="pPhys">-</td>
                </tr>
            </table>

            <div class="message-box">
                <div class="message-title">각오 및 소개</div>
                <div id="pMessage" class="message-content">"대연초등학교 야구부 파이팅!"</div>
            </div>
        </div>
    </div>
</div>

<script>
    const defaultAvatar = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23cbd5e1'/%3E%3Cpath d='M32 30 C32 18 42 12 50 12 C58 12 68 18 68 30 C68 40 58 48 50 48 C42 48 32 40 32 30 Z' fill='%2364748b'/%3E%3Cpath d='M44 14 C48 10 56 10 65 14 C74 18 84 18 86 21 C86 24 75 25 65 24 Z' fill='%230b2240'/%3E%3Cpath d='M20 92 C20 66 34 56 50 56 C66 56 80 66 80 92 Z' fill='%23475569'/%3E%3C/svg%3E";

    async function loadPlayerProfile() {
        const params = new URLSearchParams(window.location.search);
        const playerPath = params.get('path'); // 예: "5/2" 또는 "staff/70"

        if (!playerPath) {
            document.getElementById('loading').innerHTML = '선수 정보 경로가 지정되지 않았습니다.<br><br><a href="index.html" class="back-btn" style="background:#0b2240;">목록으로 이동</a>';
            return;
        }

        try {
            const res = await fetch(`data/players/${playerPath}.json`);
            if (!res.ok) throw new Error('파일 없음');
            const data = await res.json();

            document.getElementById('loading').style.display = 'none';
            document.getElementById('profileCard').style.display = 'block';

            document.getElementById('backWatermark').textContent = data.no;
            document.getElementById('pNo').textContent = `No.${data.no}`;
            document.getElementById('pName').textContent = data.name;

            const isStaff = (data.grade === '감독' || data.grade === '코치');
            document.getElementById('pGradeBadge').textContent = isStaff ? data.grade : `${data.grade}학년`;
            document.getElementById('pPosBadge').textContent = data.pos || '선수';

            const photoElem = document.getElementById('pPhoto');
            photoElem.src = data.photo || defaultAvatar;
            photoElem.onerror = () => { photoElem.src = defaultAvatar; };

            document.getElementById('pPos').textContent = data.pos || '-';
            document.getElementById('pBt').textContent = data.bt || '-';
            document.getElementById('pBirth').textContent = data.birth || '-';

            let phys = '-';
            if (data.height && data.weight) phys = `${data.height}cm / ${data.weight}kg`;
            else if (data.height) phys = `${data.height}cm`;
            else if (data.weight) phys = `${data.weight}kg`;
            document.getElementById('pPhys').textContent = phys;

            if (data.message) {
                document.getElementById('pMessage').textContent = `"${data.message}"`;
            }
        } catch (e) {
            document.getElementById('loading').innerHTML = `선수 정보를 불러올 수 없습니다.<br>(data/players/${playerPath}.json 확인 필요)<br><br><a href="index.html" class="back-btn" style="background:#0b2240;">목록으로 이동</a>`;
        }
    }

    loadPlayerProfile();
</script>

</body>
</html>
