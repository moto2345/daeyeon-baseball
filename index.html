<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대연초 야구부 명단</title>
    <style>
        :root {
            --kbo-blue: #0b2240;
            --kbo-sub-blue: #163868;
            --kbo-red: #c8102e;
            --bg-gray: #f4f6f9;
            --card-border: #e2e8f0;
            --text-title: #0f172a;
            --text-sub: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-gray);
            color: var(--text-title);
            padding-bottom: 70px;
        }

        /* 헤더 */
        header {
            background-color: var(--kbo-blue);
            color: white;
            padding: 30px 20px 25px;
            text-align: center;
            border-bottom: 5px solid var(--kbo-red);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            position: relative;
        }

        .header-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .header-subtitle {
            font-size: 13px;
            color: #cbd5e1;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .admin-toggle-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .admin-toggle-btn:hover { background: rgba(255,255,255,0.25); }
        .admin-toggle-btn.logged-in {
            background: #fee2e2;
            color: var(--kbo-red);
            border-color: #fca5a5;
        }

        .container {
            max-width: 1040px;
            margin: 20px auto 0;
            padding: 0 16px;
        }

        /* 컨트롤 패널 */
        .control-card {
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .grade-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-btn {
            background: #ffffff;
            border: 1px solid #d1d5db;
            color: #4b5563;
            padding: 6px 13px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }

        .filter-btn:hover { background: #f3f4f6; }
        .filter-btn.active {
            background: var(--kbo-blue);
            color: #ffffff;
            border-color: var(--kbo-blue);
            font-weight: 700;
        }
        .filter-btn.staff-tab.active {
            background: #1e293b;
            border-color: #1e293b;
        }

        .control-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .search-box input {
            padding: 7px 12px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 13px;
            width: 170px;
            outline: none;
        }

        .view-switch {
            display: flex;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            overflow: hidden;
        }

        .view-btn {
            background: #ffffff;
            border: none;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 700;
            color: #6b7280;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: 0.15s;
        }

        .view-btn.active {
            background: var(--kbo-sub-blue);
            color: #ffffff;
        }

        /* 관리자 안내 바 */
        .admin-bar {
            display: none;
            border-radius: 8px;
            padding: 10px 14px;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .admin-bar.super { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; }
        .admin-bar.sub { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
        .admin-bar.general { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }

        .btn-add {
            background: #2563eb;
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-export {
            background: #059669;
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        /* 리스트형 테이블 */
        .table-wrap {
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            overflow-x: auto;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 14px;
            min-width: 780px;
        }

        th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 700;
            padding: 12px 8px;
            font-size: 13px;
            border-bottom: 2px solid #e2e8f0;
            white-space: nowrap;
        }

        td {
            padding: 10px 8px;
            border-bottom: 1px solid #edf2f7;
            vertical-align: middle;
        }

        tr.is-hidden {
            background-color: #f8fafc !important;
            opacity: 0.65;
        }

        .td-no {
            font-weight: 900;
            color: var(--kbo-blue);
            font-size: 16px;
            font-family: "Impact", sans-serif;
        }

        .table-thumb-wrap {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            background: #e2e8f0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #cbd5e1;
        }

        .table-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
        }

        .td-name {
            font-weight: 800;
            color: #111827;
            font-size: 15px;
        }

        /* 학년 뱃지 */
        .grade-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }
        .grade-staff { background: #0f172a; color: #ffffff; }
        .grade-6 { background: #fee2e2; color: #991b1b; }
        .grade-5 { background: #fef3c7; color: #92400e; }
        .grade-4 { background: #e0e7ff; color: #3730a3; }
        .grade-3 { background: #dcfce7; color: #166534; }
        .grade-2 { background: #f3e8ff; color: #6b21a8; }
        .grade-1 { background: #e0f2fe; color: #0369a1; }

        /* 포지션 뱃지 */
        .pos-tag {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
        }
        .pos-staff-leader { background: #b45309; }
        .pos-staff-coach { background: #475569; }
        .pos-투수 { background: #c2410c; }
        .pos-포수 { background: #0f766e; }
        .pos-내야수 { background: #1d4ed8; }
        .pos-외야수 { background: #15803d; }

        /* 숨김 표시 뱃지 */
        .hidden-badge {
            display: inline-block;
            background: #64748b;
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
            margin-left: 4px;
        }

        /* 이미지형 카드 그리드 */
        .roster-grid {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
            gap: 14px;
        }

        .player-card {
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            transition: transform 0.15s, box-shadow 0.15s;
            position: relative;
        }

        .player-card.is-hidden {
            opacity: 0.65;
            border-color: #cbd5e1;
            background: #f8fafc;
        }

        .card-photo-box {
            width: 100%;
            aspect-ratio: 1 / 1.05;
            background: #e2e8f0;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
        }

        .card-no-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(11, 34, 64, 0.92);
            color: #ffffff;
            font-size: 13px;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 6px;
            font-family: "Impact", sans-serif;
            border: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 2;
        }

        .card-pos {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 2;
        }

        .card-info {
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-name-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-name {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-title);
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .card-name-no {
            font-family: "Impact", sans-serif;
            color: var(--kbo-red);
            font-size: 15px;
            font-weight: 900;
        }

        .card-meta {
            font-size: 12px;
            color: var(--text-sub);
        }

        .card-extra {
            font-size: 11px;
            color: #64748b;
            background: #f8fafc;
            border-radius: 6px;
            padding: 5px 6px;
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            border: 1px solid #f1f5f9;
        }

        /* 관리자 버튼 바 */
        .btn-table-edit { padding: 4px 8px; border: 1px solid #cbd5e1; background: #ffffff; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; }
        .btn-table-del { padding: 4px 8px; border: 1px solid #fca5a5; background: #fee2e2; color: #b91c1c; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; margin-left: 4px; }
        .btn-table-toggle { padding: 4px 8px; border: 1px solid #94a3b8; background: #f1f5f9; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; margin-left: 4px; }

        .card-admin-bar {
            display: none;
            padding: 8px 10px;
            border-top: 1px dashed var(--card-border);
            gap: 4px;
            background: #fafafa;
        }
        .card-admin-bar button { flex: 1; padding: 5px 0; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; border: 1px solid #cbd5e1; background: #ffffff; }

        /* 모달 팝업 */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-content {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-header { font-size: 18px; font-weight: 800; margin-bottom: 16px; }
        .form-group { margin-bottom: 11px; display: flex; flex-direction: column; gap: 4px; }
        .form-row { display: flex; gap: 8px; }
        .form-group label { font-size: 12px; font-weight: 700; color: #475569; }
        .form-group input, .form-group select { padding: 9px 12px; border: 1px solid var(--card-border); border-radius: 6px; font-size: 14px; outline: none; }
        .form-group input:disabled, .form-group select:disabled { background-color: #f1f5f9; color: #94a3b8; cursor: not-allowed; }

        .modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
        .btn-cancel { background: #f1f5f9; border: 1px solid var(--card-border); padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; }
        .btn-save { background: var(--kbo-blue); color: #ffffff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; }

        .loading-notice {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-sub);
            font-size: 14px;
        }

        @media (max-width: 600px) {
            header { padding: 22px 14px; }
            .header-title { font-size: 21px; }
            .control-top { flex-direction: column; align-items: stretch; }
            .control-right { justify-content: space-between; }
            .search-box input { width: 140px; }
            .roster-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-title">대연초 야구부 명단</div>
    <div class="header-subtitle" id="rosterCountText">선수단 데이터를 불러오는 중...</div>
    <button id="adminLoginBtn" class="admin-toggle-btn" onclick="openAdminModal()">🔒 관리자 로그인</button>
</header>

<div class="container">
    <div class="control-card">
        <div class="control-top">
            <div class="grade-filters" id="gradeFilters">
                <button class="filter-btn active" onclick="setGrade('all', this)">전체</button>
                <button class="filter-btn staff-tab" onclick="setGrade('staff', this)">코칭스태프</button>
                <button class="filter-btn" onclick="setGrade('6', this)">6학년</button>
                <button class="filter-btn" onclick="setGrade('5', this)">5학년</button>
                <button class="filter-btn" onclick="setGrade('4', this)">4학년</button>
                <button class="filter-btn" onclick="setGrade('3', this)">3학년</button>
                <button class="filter-btn" onclick="setGrade('2', this)">2학년</button>
                <button class="filter-btn" onclick="setGrade('1', this)">1학년</button>
            </div>

            <div class="control-right">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="이름 / 등번호 검색" oninput="render()">
                </div>
                <div class="view-switch">
                    <button class="view-btn active" id="btnListView" onclick="switchView('list')">☰ 리스트형</button>
                    <button class="view-btn" id="btnCardView" onclick="switchView('card')">▦ 이미지형</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 관리자 권한 안내 바 -->
    <div id="adminBar" class="admin-bar">
        <span id="adminRoleText" style="font-size: 13px; font-weight: 700;"></span>
        <div style="display: flex; gap: 6px;">
            <button id="btnAddNew" class="btn-add" style="display: none;" onclick="openPlayerModal(false)">+ 등록</button>
            <button id="btnExport" class="btn-export" style="display: none;" onclick="exportUpdatedHTML()" title="수정된 전체 소스코드를 다운로드">💾 HTML 내보내기</button>
        </div>
    </div>

    <!-- 1. 리스트형 -->
    <div class="table-wrap" id="listContainer">
        <table>
            <thead>
                <tr>
                    <th style="width: 60px;">등번호</th>
                    <th style="width: 55px;">사진</th>
                    <th>성명</th>
                    <th>구분/학년</th>
                    <th>포지션/역할</th>
                    <th>투/타</th>
                    <th>생년월일</th>
                    <th>신장 / 체중</th>
                    <th id="thAdmin" style="display: none; width: 140px;">관리</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- 2. 이미지형 -->
    <div class="roster-grid" id="cardContainer"></div>

    <div id="statusNotice" class="loading-notice">선수 명단을 불러오고 있습니다...</div>
</div>

<!-- 로그인 모달 -->
<div id="loginModal" class="modal">
    <div class="modal-content" style="max-width: 380px;">
        <div class="modal-header">관리자 접속 로그인</div>
        <div class="form-group">
            <label>관리자 비밀번호</label>
            <input type="password" id="adminPw" placeholder="비밀번호 입력">
            <span style="font-size: 11px; color: #64748b; margin-top: 4px;">
                • 최고관리자: 9999 (전체 권한 및 표시 ON/OFF)<br>
                • 부관리자: 7777 (선수 모든 정보 수정)<br>
                • 일반관리자: 1111 (포지션, 투타, 생일, 체격만 수정)
            </span>
        </div>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal('loginModal')">취소</button>
            <button class="btn-save" onclick="handleLogin()">로그인</button>
        </div>
    </div>
</div>

<!-- 지도자 / 선수 정보 수정 모달 -->
<div id="playerModal" class="modal">
    <div class="modal-content">
        <div class="modal-header" id="playerModalTitle">명단 정보 수정</div>
        <input type="hidden" id="editPlayerId">
        
        <!-- [최고관리자 전용] 명단 표시/숨김 스위치 -->
        <div class="form-group" id="groupVisibility" style="display: none; background: #fef2f2; padding: 10px; border-radius: 8px; border: 1px solid #fecaca;">
            <label style="color: #991b1b; font-weight: 800;">🔒 명단 표시 상태 (최고관리자 전용)</label>
            <select id="inpVisible" style="font-weight: 700;">
                <option value="true">✅ 화면에 정상 표시 (ON)</option>
                <option value="false">🚫 명단에서 숨김 처리 (OFF - 일반 방문자에게 안 보임)</option>
            </select>
        </div>

        <div class="form-row">
            <div class="form-group" style="flex: 1;">
                <label>등번호</label>
                <input type="number" id="inpNo" required placeholder="예: 2">
            </div>
            <div class="form-group" style="flex: 2;">
                <label>이름</label>
                <input type="text" id="inpName" required placeholder="예: 오승환">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group" style="flex: 1;">
                <label>구분 / 학년</label>
                <select id="inpGrade">
                    <optgroup label="코칭스태프">
                        <option value="감독">감독</option>
                        <option value="코치">코치</option>
                    </optgroup>
                    <optgroup label="선수단 (학년)">
                        <option value="6">6학년</option>
                        <option value="5" selected>5학년</option>
                        <option value="4">4학년</option>
                        <option value="3">3학년</option>
                        <option value="2">2학년</option>
                        <option value="1">1학년</option>
                    </optgroup>
                </select>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>포지션 / 역할</label>
                <select id="inpPos">
                    <optgroup label="지도자 역할">
                        <option value="총괄/지휘">총괄/지휘</option>
                        <option value="수석코치">수석코치</option>
                        <option value="투수코치">투수코치</option>
                        <option value="야수코치">야수코치</option>
                        <option value="타격코치">타격코치</option>
                    </optgroup>
                    <optgroup label="선수 포지션">
                        <option value="-">- 미정 -</option>
                        <option value="투수">투수</option>
                        <option value="포수">포수</option>
                        <option value="내야수">내야수</option>
                        <option value="외야수">외야수</option>
                    </optgroup>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>투/타 유형</label>
            <select id="inpBt">
                <option value="-">- 미정 -</option>
                <option value="우투우타">우투우타</option>
                <option value="좌투좌타">좌투좌타</option>
                <option value="우투좌타">우투좌타</option>
                <option value="좌투우타">좌투우타</option>
            </select>
        </div>

        <div class="form-group">
            <label>생년월일</label>

        { id: 36, no: 39, name: "이든", grade: "4", pos: "외야수", bt: "우투우타", birth: "2016.11.05", height: 144, weight: 39, visible: true },
        { id: 37, no: 44, name: "김민찬", grade: "3", pos: "내야수", bt: "우투우타", birth: "2017.05.28", height: 132, weight: 28, visible: true },

    ];

    let players = JSON.parse(localStorage.getItem('daeyeon_players_auth')) || initialPlayers;
    let selectedGrade = 'all';
    let currentView = 'list';
    let currentRole = 'guest'; // 'guest', 'general', 'sub', 'super'

    function saveToStorage() {
        localStorage.setItem('daeyeon_players_auth', JSON.stringify(players));
    }

    function isStaff(grade) {
        return grade === '감독' || grade === '코치';
    }

    function getGradeBadge(grade) {
        if (isStaff(grade)) return `<span class="grade-tag grade-staff">${grade}</span>`;
        return `<span class="grade-tag grade-${grade}">${grade}학년</span>`;
    }

    function getPosBadge(pos, grade) {
        if (!pos || pos === '-') return '-';
        if (grade === '감독') return `<span class="pos-tag pos-staff-leader">${pos}</span>`;
        if (grade === '코치') return `<span class="pos-tag pos-staff-coach">${pos}</span>`;
        return `<span class="pos-tag pos-${pos}">${pos}</span>`;
    }

    function formatPhys(h, w) {
        if (h && w) return `${h}cm / ${w}kg`;
        if (h) return `${h}cm`;
        if (w) return `${w}kg`;
        return '-';
    }

    function switchView(view) {
        currentView = view;
        const btnList = document.getElementById('btnListView');
        const btnCard = document.getElementById('btnCardView');
        const listContainer = document.getElementById('listContainer');
        const cardContainer = document.getElementById('cardContainer');

        if (view === 'list') {
            btnList.classList.add('active');
            btnCard.classList.remove('active');
            listContainer.style.display = 'block';
            cardContainer.style.display = 'none';
        } else {
            btnList.classList.remove('active');
            btnCard.classList.add('active');
            listContainer.style.display = 'none';
            cardContainer.style.display = 'grid';
        }
        render();
    }

    function setGrade(grade, btn) {
        selectedGrade = grade;
        document.querySelectorAll('#gradeFilters .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    function goToPlayer(path) {
        window.location.href = `player.html?path=${encodeURIComponent(path)}`;
    }

    function render() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const tableBody = document.getElementById('tableBody');
        const cardContainer = document.getElementById('cardContainer');
        const notice = document.getElementById('statusNotice');
        const thAdmin = document.getElementById('thAdmin');

        // 관리 열 표시 여부
        thAdmin.style.display = (currentRole !== 'guest') ? 'table-cell' : 'none';

        // 필터링: 최고관리자가 아니면 visible !== false 인 사람만 표시
        const filtered = players.filter(p => {
            const isVisible = (p.visible !== false);
            if (currentRole !== 'super' && !isVisible) return false;

            let matchGrade = false;
            if (selectedGrade === 'all') matchGrade = true;
            else if (selectedGrade === 'staff') matchGrade = isStaff(p.grade);
            else matchGrade = (p.grade.toString() === selectedGrade);

            const matchSearch = p.name.toLowerCase().includes(query) || 
                                p.no.toString().includes(query) || 
                                (p.pos && p.pos.includes(query));
            return matchGrade && matchSearch;
        }).sort((a, b) => {
            const rankA = a.grade === '감독' ? 1 : (a.grade === '코치' ? 2 : 3);
            const rankB = b.grade === '감독' ? 1 : (b.grade === '코치' ? 2 : 3);
            if (rankA !== rankB) return rankA - rankB;
            return a.no - b.no;
        });

        const activeStaff = players.filter(p => isStaff(p.grade) && (currentRole === 'super' || p.visible !== false)).length;
        const activeStudent = players.filter(p => !isStaff(p.grade) && (currentRole === 'super' || p.visible !== false)).length;
        document.getElementById('rosterCountText').textContent = `2026 OFFICIAL ROSTER (코칭스태프 ${activeStaff}명 · 등록선수 ${activeStudent}명)`;

        if (filtered.length === 0) {
            tableBody.innerHTML = '';
            cardContainer.innerHTML = '';
            notice.textContent = '조건에 맞는 명단이 없습니다.';
            notice.style.display = 'block';
            return;
        }
        notice.style.display = 'none';

        // 1. 리스트형 렌더링
        tableBody.innerHTML = filtered.map(p => {
            const photoUrl = `data/photos/${p.no}.jpg`;
            const isHidden = (p.visible === false);
            const hiddenBadge = isHidden ? `<span class="hidden-badge">숨김</span>` : '';
            const playerPath = isStaff(p.grade) ? `staff/${p.no}` : `${p.grade}/${p.no}`;

            // 관리자 조작 버튼 (역할별 분기)
            let adminActions = '';
            if (currentRole !== 'guest') {
                const editBtn = `<button class="btn-table-edit" onclick="event.stopPropagation(); editPlayer(${p.id})">수정</button>`;
                let extraBtn = '';
                if (currentRole === 'super') {
                    const toggleText = isHidden ? '표시 ON' : '숨김 OFF';
                    extraBtn = `
                        <button class="btn-table-toggle" onclick="event.stopPropagation(); quickToggleVisibility(${p.id})">${toggleText}</button>
                        <button class="btn-table-del" onclick="event.stopPropagation(); deletePlayer(${p.id})">삭제</button>
                    `;
                }
                adminActions = `<td>${editBtn}${extraBtn}</td>`;
            }

            return `
                <tr class="clickable-row ${isHidden ? 'is-hidden' : ''}" onclick="goToPlayer('${playerPath}')">
                    <td class="td-no">${p.no}</td>
                    <td>
                        <div class="table-thumb-wrap">
                            <img class="table-thumb" src="${photoUrl}" alt="${p.name}" onerror="this.onerror=null; this.src='${defaultAvatar}';">
                        </div>
                    </td>
                    <td class="td-name">${p.name}${hiddenBadge}</td>
                    <td>${getGradeBadge(p.grade)}</td>
                    <td>${getPosBadge(p.pos, p.grade)}</td>
                    <td style="color: #64748b;">${p.bt || '-'}</td>
                    <td style="color: #475569; font-size: 13px;">${p.birth || '-'}</td>
                    <td style="color: #475569; font-size: 13px;">${formatPhys(p.height, p.weight)}</td>
                    ${adminActions}
                </tr>
            `;
        }).join('');

        // 2. 이미지형 렌더링
        cardContainer.innerHTML = filtered.map(p => {
            const photoUrl = `data/photos/${p.no}.jpg`;
            const isHidden = (p.visible === false);
            const hiddenBadge = isHidden ? `<span class="hidden-badge">숨김</span>` : '';
            const posBadge = (p.pos && p.pos !== '-') ? getPosBadge(p.pos, p.grade) : '';
            const extraMeta = isStaff(p.grade) ? (p.bt && p.bt !== '-' ? p.bt : '지도자') : (p.bt || '우투우타');
            const playerPath = isStaff(p.grade) ? `staff/${p.no}` : `${p.grade}/${p.no}`;

            let cardAdminHtml = '';
            if (currentRole !== 'guest') {
                let cardBtns = `<button onclick="event.stopPropagation(); editPlayer(${p.id})">수정</button>`;
                if (currentRole === 'super') {
                    const toggleLabel = isHidden ? '노출 ON' : '숨김 OFF';
                    cardBtns += `<button onclick="event.stopPropagation(); quickToggleVisibility(${p.id})">${toggleLabel}</button>`;
                    cardBtns += `<button style="color: #dc2626;" onclick="event.stopPropagation(); deletePlayer(${p.id})">삭제</button>`;
                }
                cardAdminHtml = `<div class="card-admin-bar" style="display: flex;">${cardBtns}</div>`;
            }

            return `
                <div class="player-card ${isHidden ? 'is-hidden' : ''}" onclick="goToPlayer('${playerPath}')">
                    <div class="card-photo-box">
                        <span class="card-no-badge">No.${p.no}</span>
                        <div class="card-pos">${posBadge}</div>
                        <img class="card-img" src="${photoUrl}" alt="${p.name}" onerror="this.onerror=null; this.src='${defaultAvatar}';">
                    </div>
                    <div class="card-info">
                        <div class="card-name-row">
                            <span class="card-name"><span class="card-name-no">No.${p.no}</span> ${p.name}${hiddenBadge}</span>
                            ${getGradeBadge(p.grade)}
                        </div>
                        <div class="card-meta">${extraMeta}</div>
                        <div class="card-extra">
                            <div>🎂 ${p.birth || '-'}</div>
                            <div>📏 ${formatPhys(p.height, p.weight)}</div>
                        </div>
                    </div>
                    ${cardAdminHtml}
                </div>
            `;
        }).join('');
    }

    // 관리자 로그인/로그아웃 처리
    function openAdminModal() {
        if (currentRole !== 'guest') {
            if (confirm('관리자 모드를 로그아웃 하시겠습니까?')) {
                currentRole = 'guest';
                updateAdminUI();
                render();
            }
        } else {
            document.getElementById('adminPw').value = '';
            document.getElementById('loginModal').style.display = 'flex';
        }
    }

    function handleLogin() {
        const pw = document.getElementById('adminPw').value.trim();
        if (pw === '9999') {
            currentRole = 'super';
            alert('최고관리자로 로그인되었습니다. (전체 수정 / 노출 ON/OFF 가능)');
        } else if (pw === '7777') {
            currentRole = 'sub';
            alert('부관리자로 로그인되었습니다. (선수 전체 정보 수정 가능)');
        } else if (pw === '1111') {
            currentRole = 'general';
            alert('일반관리자로 로그인되었습니다. (포지션/투타/생일/체격 수정 가능)');
        } else {
            alert('비밀번호가 올바르지 않습니다.');
            return;
        }

        closeModal('loginModal');
        updateAdminUI();
        render();
    }

    function updateAdminUI() {
        const adminBar = document.getElementById('adminBar');
        const adminBtn = document.getElementById('adminLoginBtn');
        const roleText = document.getElementById('adminRoleText');
        const btnAddNew = document.getElementById('btnAddNew');
        const btnExport = document.getElementById('btnExport');

        adminBar.className = 'admin-bar';

        if (currentRole === 'super') {
            adminBtn.textContent = '🔓 최고관리자 로그아웃';
            adminBtn.classList.add('logged-in');
            adminBar.classList.add('super');
            adminBar.style.display = 'flex';
            roleText.textContent = '👑 최고관리자 모드 실행 중 (전체 제어 & 표시 ON/OFF)';
            btnAddNew.style.display = 'inline-block';
            btnExport.style.display = 'inline-block';
        } else if (currentRole === 'sub') {
            adminBtn.textContent = '🔓 부관리자 로그아웃';
            adminBtn.classList.add('logged-in');
            adminBar.classList.add('sub');
            adminBar.style.display = 'flex';
            roleText.textContent = '🛠️ 부관리자 모드 실행 중 (선수 모든 정보 수정 가능)';
            btnAddNew.style.display = 'none';
            btnExport.style.display = 'none';
        } else if (currentRole === 'general') {
            adminBtn.textContent = '🔓 일반관리자 로그아웃';
            adminBtn.classList.add('logged-in');
            adminBar.classList.add('general');
            adminBar.style.display = 'flex';
            roleText.textContent = '📋 일반관리자 모드 실행 중 (포지션·투타·생일·체격만 수정)';
            btnAddNew.style.display = 'none';
            btnExport.style.display = 'none';
        } else {
            adminBtn.textContent = '🔒 관리자 로그인';
            adminBtn.classList.remove('logged-in');
            adminBar.style.display = 'none';
        }
    }

    // 선수 정보 수정 모달 열기 및 권한별 필드 잠금/해제
    function editPlayer(id) {
        const p = players.find(x => x.id === id);
        if (!p) return;

        document.getElementById('playerModalTitle').textContent = `[No.${p.no} ${p.name}] 정보 수정`;
        document.getElementById('editPlayerId').value = p.id;
        document.getElementById('inpNo').value = p.no;
        document.getElementById('inpName').value = p.name;
        document.getElementById('inpGrade').value = p.grade;
        document.getElementById('inpPos').value = p.pos || '-';
        document.getElementById('inpBt').value = p.bt || '-';
        document.getElementById('inpBirth').value = p.birth || '';
        document.getElementById('inpHeight').value = p.height || '';
        document.getElementById('inpWeight').value = p.weight || '';
        document.getElementById('inpVisible').value = (p.visible !== false) ? 'true' : 'false';

        // 1. [최고관리자]만 노출 여부(ON/OFF) 제어 가능
        document.getElementById('groupVisibility').style.display = (currentRole === 'super') ? 'flex' : 'none';

        // 2. [일반관리자]는 등번호, 성명, 학년 수정 금지 (잠금 처리)
        if (currentRole === 'general') {
            document.getElementById('inpNo').disabled = true;
            document.getElementById('inpName').disabled = true;
            document.getElementById('inpGrade').disabled = true;
        } else {
            document.getElementById('inpNo').disabled = false;
            document.getElementById('inpName').disabled = false;
            document.getElementById('inpGrade').disabled = false;
        }

        // 공통 수정 가능 필드는 항상 활성화
        document.getElementById('inpPos').disabled = false;
        document.getElementById('inpBt').disabled = false;
        document.getElementById('inpBirth').disabled = false;
        document.getElementById('inpHeight').disabled = false;
        document.getElementById('inpWeight').disabled = false;

        document.getElementById('playerModal').style.display = 'flex';
    }

    function openPlayerModal(isEdit) {
        if (currentRole !== 'super') {
            alert('신규 등록 권한이 없습니다.');
            return;
        }
        document.getElementById('playerModalTitle').textContent = '새 지도자 / 선수 등록';
        document.getElementById('editPlayerId').value = '';
        document.getElementById('inpNo').value = '';
        document.getElementById('inpName').value = '';
        document.getElementById('inpBirth').value = '';
        document.getElementById('inpHeight').value = '';
        document.getElementById('inpWeight').value = '';
        document.getElementById('groupVisibility').style.display = 'flex';
        document.getElementById('inpVisible').value = 'true';

        document.getElementById('inpNo').disabled = false;
        document.getElementById('inpName').disabled = false;
        document.getElementById('inpGrade').disabled = false;

        document.getElementById('playerModal').style.display = 'flex';
    }

    function savePlayer() {
        const idVal = document.getElementById('editPlayerId').value;
        const no = parseInt(document.getElementById('inpNo').value);
        const name = document.getElementById('inpName').value.trim();
        const grade = document.getElementById('inpGrade').value;
        const pos = document.getElementById('inpPos').value;
        const bt = document.getElementById('inpBt').value;
        const birth = document.getElementById('inpBirth').value.trim();
        const height = document.getElementById('inpHeight').value.trim();
        const weight = document.getElementById('inpWeight').value.trim();
        const visible = (document.getElementById('inpVisible').value === 'true');

        if (!idVal && (!no || !name)) {
            alert('등번호와 성명을 정확히 입력해 주세요.');
            return;
        }

        if (idVal) {
            const idx = players.findIndex(x => x.id == idVal);
            if (idx !== -1) {
                if (currentRole === 'general') {
                    // 일반관리자: 포지션, 투타, 생일, 키, 몸무게만 반영
                    players[idx] = { ...players[idx], pos, bt, birth, height, weight };
                } else if (currentRole === 'sub') {
                    // 부관리자: 선수 모든 정보 반영 (노출 여부 변경은 유지)
                    players[idx] = { ...players[idx], no, name, grade, pos, bt, birth, height, weight };
                } else if (currentRole === 'super') {
                    // 최고관리자: 노출 여부 포함 전체 반영
                    players[idx] = { ...players[idx], no, name, grade, pos, bt, birth, height, weight, visible };
                }
            }
        } else {
            const newId = players.length > 0 ? Math.max(...players.map(p => p.id)) + 1 : 1;
            players.push({ id: newId, no, name, grade, pos, bt, birth, height, weight, visible: true });
        }

        saveToStorage();
        closeModal('playerModal');
        render();
    }

    // [최고관리자] 명단에서 빠른 표시/숨김 토글
    function quickToggleVisibility(id) {
        if (currentRole !== 'super') return;
        const idx = players.findIndex(p => p.id === id);
        if (idx !== -1) {
            const current = (players[idx].visible !== false);
            players[idx].visible = !current;
            saveToStorage();
            render();
        }
    }

    // [최고관리자] 삭제
    function deletePlayer(id) {
        if (currentRole !== 'super') {
            alert('삭제 권한은 최고관리자에게만 있습니다.');
            return;
        }
        if (confirm('해당 선수를 명단에서 완전히 삭제하시겠습니까?')) {
            players = players.filter(p => p.id !== id);
            saveToStorage();
            render();
        }
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    // 수정본 HTML 영구 저장 내보내기
    function exportUpdatedHTML() {
        if (currentRole !== 'super') {
            alert('최고관리자만 전체 소스코드를 내보낼 수 있습니다.');
            return;
        }
        const fullSource = document.documentElement.outerHTML;
        const jsonStr = JSON.stringify(players, null, 8);
        const regex = /const initialPlayers = \[[\s\S]*?\];/;
        const updatedSource = "<!DOCTYPE html>\n<html lang=\"ko\">\n" + fullSource.replace(regex, `const initialPlayers = ${jsonStr};`) + "\n</html>";

        const blob = new Blob([updatedSource], { type: 'text/html;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'index.html';
        a.click();
    }

    // 초기 화면 구성
    render();
</script>

</body>
</html>
