<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대연초 야구부 명단</title>
    <style>
        :root {
            --kbo-blue: #0b2240;
            --kbo-sub-blue: #163868;
            --kbo-red: #c8102e;
            --bg-gray: #f4f6f9;
            --card-border: #e2e8f0;
            --text-title: #0f172a;
            --text-sub: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-gray);
            color: var(--text-title);
            padding-bottom: 70px;
        }

        header {
            background-color: var(--kbo-blue);
            color: white;
            padding: 30px 20px 25px;
            text-align: center;
            border-bottom: 5px solid var(--kbo-red);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .header-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .header-subtitle {
            font-size: 13px;
            color: #cbd5e1;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .container {
            max-width: 1040px;
            margin: 20px auto 0;
            padding: 0 16px;
        }

        .control-card {
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .grade-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-btn {
            background: #ffffff;
            border: 1px solid #d1d5db;
            color: #4b5563;
            padding: 6px 13px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }

        .filter-btn:hover { background: #f3f4f6; }
        .filter-btn.active {
            background: var(--kbo-blue);
            color: #ffffff;
            border-color: var(--kbo-blue);
            font-weight: 700;
        }
        .filter-btn.staff-tab.active {
            background: #1e293b;
            border-color: #1e293b;
        }

        .control-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .search-box input {
            padding: 7px 12px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 13px;
            width: 170px;
            outline: none;
        }

        .view-switch {
            display: flex;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            overflow: hidden;
        }

        .view-btn {
            background: #ffffff;
            border: none;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 700;
            color: #6b7280;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: 0.15s;
        }

        .view-btn.active {
            background: var(--kbo-sub-blue);
            color: #ffffff;
        }

        .table-wrap {
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            overflow-x: auto;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 14px;
            min-width: 760px;
        }

        th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 700;
            padding: 12px 8px;
            font-size: 13px;
            border-bottom: 2px solid #e2e8f0;
            white-space: nowrap;
        }

        td {
            padding: 10px 8px;
            border-bottom: 1px solid #edf2f7;
            vertical-align: middle;
        }

        tr.clickable-row {
            cursor: pointer;
            transition: background 0.15s;
        }

        tr.clickable-row:hover td { background-color: #f1f5f9; }

        .td-no {
            font-weight: 900;
            color: var(--kbo-blue);
            font-size: 16px;
            font-family: "Impact", sans-serif;
        }

        .table-thumb-wrap {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            background: #e2e8f0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #cbd5e1;
        }

        .table-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
        }

        .td-name {
            font-weight: 800;
            color: #111827;
            font-size: 15px;
        }

        .grade-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }
        .grade-staff { background: #0f172a; color: #ffffff; }
        .grade-6 { background: #fee2e2; color: #991b1b; }
        .grade-5 { background: #fef3c7; color: #92400e; }
        .grade-4 { background: #e0e7ff; color: #3730a3; }
        .grade-3 { background: #dcfce7; color: #166534; }
        .grade-2 { background: #f3e8ff; color: #6b21a8; }
        .grade-1 { background: #e0f2fe; color: #0369a1; }

        .pos-tag {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
        }
        .pos-staff-leader { background: #b45309; }
        .pos-staff-coach { background: #475569; }
        .pos-투수 { background: #c2410c; }
        .pos-포수 { background: #0f766e; }
        .pos-내야수 { background: #1d4ed8; }
        .pos-외야수 { background: #15803d; }

        .roster-grid {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
            gap: 14px;
        }

        .player-card {
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            transition: transform 0.15s, box-shadow 0.15s;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }

        .player-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
        }

        .card-photo-box {
            width: 100%;
            aspect-ratio: 1 / 1.05;
            background: #e2e8f0;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
        }

        .card-no-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(11, 34, 64, 0.92);
            color: #ffffff;
            font-size: 13px;
            font-weight: 900;
            padding: 3px 8px;
            border-radius: 6px;
            font-family: "Impact", sans-serif;
            border: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 2;
        }

        .card-pos {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 2;
        }

        .card-info {
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-name-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-name {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-title);
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .card-name-no {
            font-family: "Impact", sans-serif;
            color: var(--kbo-red);
            font-size: 15px;
            font-weight: 900;
        }

        .card-meta {
            font-size: 12px;
            color: var(--text-sub);
        }

        .card-extra {
            font-size: 11px;
            color: #64748b;
            background: #f8fafc;
            border-radius: 6px;
            padding: 5px 6px;
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            border: 1px solid #f1f5f9;
        }

        .loading-notice {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-sub);
            font-size: 14px;
        }

        @media (max-width: 600px) {
            header { padding: 22px 14px; }
            .header-title { font-size: 21px; }
            .control-top { flex-direction: column; align-items: stretch; }
            .control-right { justify-content: space-between; }
            .search-box input { width: 140px; }
            .roster-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-title">대연초 야구부 명단</div>
    <div class="header-subtitle" id="rosterCountText">선수단 데이터를 불러오는 중...</div>
</header>

<div class="container">
    <div class="control-card">
        <div class="control-top">
            <div class="grade-filters" id="gradeFilters">
                <button class="filter-btn active" onclick="setGrade('all', this)">전체</button>
                <button class="filter-btn staff-tab" onclick="setGrade('staff', this)">코칭스태프</button>
                <button class="filter-btn" onclick="setGrade('6', this)">6학년</button>
                <button class="filter-btn" onclick="setGrade('5', this)">5학년</button>
                <button class="filter-btn" onclick="setGrade('4', this)">4학년</button>
                <button class="filter-btn" onclick="setGrade('3', this)">3학년</button>
                <button class="filter-btn" onclick="setGrade('2', this)">2학년</button>
                <button class="filter-btn" onclick="setGrade('1', this)">1학년</button>
            </div>

            <div class="control-right">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="이름 / 등번호 검색" oninput="render()">
                </div>
                <div class="view-switch">
                    <button class="view-btn active" id="btnListView" onclick="switchView('list')">☰ 리스트형</button>
                    <button class="view-btn" id="btnCardView" onclick="switchView('card')">▦ 이미지형</button>
                </div>
            </div>
        </div>
    </div>

    <div class="table-wrap" id="listContainer">
        <table>
            <thead>
                <tr>
                    <th style="width: 60px;">등번호</th>
                    <th style="width: 55px;">사진</th>
                    <th>성명</th>
                    <th>구분/학년</th>
                    <th>포지션/역할</th>
                    <th>투/타</th>
                    <th>생년월일</th>
                    <th>신장 / 체중</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <div class="roster-grid" id="cardContainer"></div>

    <div id="statusNotice" class="loading-notice">선수 명단을 불러오고 있습니다...</div>
</div>

<script>
    const defaultAvatar = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23e2e8f0'/%3E%3Cpath d='M32 32 C32 18 42 12 50 12 C58 12 68 18 68 32 C68 40 58 48 50 48 C42 48 32 40 32 32 Z' fill='%2394a3b8'/%3E%3Cpath d='M44 14 C48 10 56 10 65 14 C74 18 84 18 86 21 C86 24 75 25 65 24 Z' fill='%230b2240'/%3E%3Cpath d='M20 92 C20 66 34 56 50 56 C66 56 80 66 80 92 Z' fill='%2364748b'/%3E%3C/svg%3E";

    let players = [];
    let selectedGrade = 'all';
    let currentView = 'list';

    function isStaff(grade) {
        return grade === '감독' || grade === '코치';
    }

    function getGradeBadge(grade) {
        if (isStaff(grade)) return `<span class="grade-tag grade-staff">${grade}</span>`;
        return `<span class="grade-tag grade-${grade}">${grade}학년</span>`;
    }

    function getPosBadge(pos, grade) {
        if (!pos || pos === '-') return '-';
        if (grade === '감독') return `<span class="pos-tag pos-staff-leader">${pos}</span>`;
        if (grade === '코치') return `<span class="pos-tag pos-staff-coach">${pos}</span>`;
        return `<span class="pos-tag pos-${pos}">${pos}</span>`;
    }

    function formatPhys(h, w) {
        if (h && w) return `${h}cm / ${w}kg`;
        if (h) return `${h}cm`;
        if (w) return `${w}kg`;
        return '-';
    }

    function switchView(view) {
        currentView = view;
        const btnList = document.getElementById('btnListView');
        const btnCard = document.getElementById('btnCardView');
        const listContainer = document.getElementById('listContainer');
        const cardContainer = document.getElementById('cardContainer');

        if (view === 'list') {
            btnList.classList.add('active');
            btnCard.classList.remove('active');
            listContainer.style.display = 'block';
            cardContainer.style.display = 'none';
        } else {
            btnList.classList.remove('active');
            btnCard.classList.add('active');
            listContainer.style.display = 'none';
            cardContainer.style.display = 'grid';
        }
        render();
    }

    function setGrade(grade, btn) {
        selectedGrade = grade;
        document.querySelectorAll('#gradeFilters .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    function goToPlayer(path) {
        window.location.href = `player.html?path=${encodeURIComponent(path)}`;
    }

    function render() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const tableBody = document.getElementById('tableBody');
        const cardContainer = document.getElementById('cardContainer');
        const notice = document.getElementById('statusNotice');

        const filtered = players.filter(p => {
            let matchGrade = false;
            if (selectedGrade === 'all') matchGrade = true;
            else if (selectedGrade === 'staff') matchGrade = isStaff(p.grade);
            else matchGrade = (p.grade.toString() === selectedGrade);

            const matchSearch = p.name.toLowerCase().includes(query) || 
                                p.no.toString().includes(query) || 
                                (p.pos && p.pos.includes(query));
            return matchGrade && matchSearch;
        });

        if (filtered.length === 0) {
            tableBody.innerHTML = '';
            cardContainer.innerHTML = '';
            notice.textContent = '조건에 맞는 명단이 없습니다.';
            notice.style.display = 'block';
            return;
        }
        notice.style.display = 'none';

        // 1. 리스트형 렌더링
        tableBody.innerHTML = filtered.map(p => {
            const photoUrl = `data/photos/${p.no}.jpg`;
            return `
                <tr class="clickable-row" onclick="goToPlayer('${p._path}')" title="클릭하여 ${p.name} 상세 프로필 보기">
                    <td class="td-no">${p.no}</td>
                    <td>
                        <div class="table-thumb-wrap">
                            <img class="table-thumb" src="${photoUrl}" alt="${p.name}" onerror="this.onerror=null; this.src='${defaultAvatar}';">
                        </div>
                    </td>
                    <td class="td-name">${p.name}</td>
                    <td>${getGradeBadge(p.grade)}</td>
                    <td>${getPosBadge(p.pos, p.grade)}</td>
                    <td style="color: #64748b;">${p.bt || '-'}</td>
                    <td style="color: #475569; font-size: 13px;">${p.birth || '-'}</td>
                    <td style="color: #475569; font-size: 13px;">${formatPhys(p.height, p.weight)}</td>
                </tr>
            `;
        }).join('');

        // 2. 이미지형 렌더링
        cardContainer.innerHTML = filtered.map(p => {
            const photoUrl = `data/photos/${p.no}.jpg`;
            const posBadge = (p.pos && p.pos !== '-') ? getPosBadge(p.pos, p.grade) : '';
            const extraMeta = isStaff(p.grade) ? (p.bt && p.bt !== '-' ? p.bt : '지도자') : (p.bt || '우투우타');

            return `
                <div class="player-card" onclick="goToPlayer('${p._path}')" title="클릭하여 ${p.name} 상세 프로필 보기">
                    <div class="card-photo-box">
                        <span class="card-no-badge">No.${p.no}</span>
                        <div class="card-pos">${posBadge}</div>
                        <img class="card-img" src="${photoUrl}" alt="${p.name}" onerror="this.onerror=null; this.src='${defaultAvatar}';">
                    </div>
                    <div class="card-info">
                        <div class="card-name-row">
                            <span class="card-name"><span class="card-name-no">No.${p.no}</span> ${p.name}</span>
                            ${getGradeBadge(p.grade)}
                        </div>
                        <div class="card-meta">${extraMeta}</div>
                        <div class="card-extra">
                            <div>🎂 ${p.birth || '-'}</div>
                            <div>📏 ${formatPhys(p.height, p.weight)}</div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    async function initData() {
        try {
            const rosterRes = await fetch('data/roster.json');
            if (!rosterRes.ok) throw new Error('roster.json 로드 실패');
            const rosterList = await rosterRes.json();

            const fetchPromises = rosterList.map(itemPath =>
                fetch(`data/players/${itemPath}.json`)
                    .then(res => res.ok ? res.json() : null)
                    .then(data => {
                        if (data) data._path = itemPath;
                        return data;
                    })
                    .catch(() => null)
            );

            const loaded = await Promise.all(fetchPromises);
            players = loaded.filter(p => p !== null);

            players.sort((a, b) => {
                const rankA = a.grade === '감독' ? 1 : (a.grade === '코치' ? 2 : 3);
                const rankB = b.grade === '감독' ? 1 : (b.grade === '코치' ? 2 : 3);
                if (rankA !== rankB) return rankA - rankB;
                return a.no - b.no;
            });

            const staffCount = players.filter(p => isStaff(p.grade)).length;
            const studentCount = players.length - staffCount;
            document.getElementById('rosterCountText').textContent = `2026 OFFICIAL ROSTER (코칭스태프 ${staffCount}명 · 등록선수 ${studentCount}명)`;

            render();
        } catch (e) {
            document.getElementById('statusNotice').innerHTML = 
                `데이터를 불러올 수 없습니다.<br><code>data/roster.json</code> 및 <code>data/players/학년/등번호.json</code> 구조를 확인해주세요.`;
        }
    }

    initData();
</script>

</body>
</html>
