<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- 구글 스프레드시트 연동 설정 (CSV 주소 & 편집창 주소) -->
    <script>
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSw2YtYByfiPWXbRfqkzmZ6yzaZVfJHO0f9zAmCiLnwlMvVXCt9lv4AmQAz4_vSjzPy0APtl0hwYNmW/pub?output=csv";
        const GOOGLE_SHEET_EDIT_URL = "https://docs.google.com/spreadsheets/d/1ljpHkiJL_H1NN5rwTaQOL5QYeev32QvaBTKzxSPgNVA/edit?gid=1653839889#gid=1653839889";
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대연초 야구부 명단</title>
    <!-- CSV 파싱 라이브러리 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

    <style>
        :root {
            --kbo-blue: #0b2240;
            --kbo-sub-blue: #163868;
            --kbo-red: #c8102e;
            --bg-gray: #f4f6f9;
            --card-border: #e2e8f0;
            --text-title: #0f172a;
            --text-sub: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-gray);
            color: var(--text-title);
            padding-bottom: 70px;
        }

        /* 헤더 */
        header {
            background-color: var(--kbo-blue);
            color: white;
            padding: 30px 20px 25px;
            text-align: center;
            border-bottom: 5px solid var(--kbo-red);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            position: relative;
        }

        .header-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .header-subtitle {
            font-size: 13px;
            color: #cbd5e1;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .admin-toggle-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .admin-toggle-btn:hover { background: rgba(255,255,255,0.25); }
        .admin-toggle-btn.logged-in {
            background: #fee2e2;
            color: var(--kbo-red);
            border-color: #fca5a5;
        }

        .container {
            max-width: 1040px;
            margin: 20px auto 0;
            padding: 0 16px;
        }

        /* 컨트롤 패널 */
        .control-card {
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .grade-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-btn {
            background: #ffffff;
            border: 1px solid #d1d5db;
            color: #4b5563;
            padding: 6px 13px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }

        .filter-btn:hover { background: #f3f4f6; }
        .filter-btn.active {
            background: var(--kbo-blue);
            color: #ffffff;
            border-color: var(--kbo-blue);
            font-weight: 700;
        }
        .filter-btn.staff-tab.active {
            background: #1e293b;
            border-color: #1e293b;
        }

        .control-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .search-box input {
            padding: 7px 12px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 13px;
            width: 170px;
            outline: none;
        }

        .view-switch {
            display: flex;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            overflow: hidden;
        }

        .view-btn {
            background: #ffffff;
            border: none;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 700;
            color: #6b7280;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: 0.15s;
        }

        .view-btn.active {
            background: var(--kbo-sub-blue);
            color: #ffffff;
        }

        /* 관리자 안내 바 (등급별 색상) */
        .admin-bar {
            display: none;
            border-radius: 8px;
            padding: 10px 14px;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .admin-bar.super { background: #fee2e2; border: 1px solid #fca5a5; color: #991b1b; }
        .admin-bar.sub { background: #eff6ff; border: 1px solid #bfdbfe; color: #1e40af; }
        .admin-bar.general { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; }

        .btn-sheet-link {
            background: #059669;
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .btn-sheet-link:hover { background: #047857; }

        /* 리스트형 테이블 */
        .table-wrap {
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            overflow-x: auto;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 14px;
            min-width: 820px;
        }

        th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 700;
            padding: 12px 8px;
            font-size: 13px;
            border-bottom: 2px solid #e2e8f0;
            white-space: nowrap;
        }

        td {
            padding: 10px 8px;
            border-bottom: 1px solid #edf2f7;
            vertical-align: middle;
        }

        tr.clickable-row { cursor: pointer; }
        tr.is-hidden {
            background-color: #f8fafc !important;
            opacity: 0.65;
        }

        .td-no {
            font-weight: 800;
            color: var(--kbo-blue);
            font-size: 16px;
            letter-spacing: -0.2px;
        }

        .table-thumb-wrap {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            overflow: hidden;
            background: #e2e8f0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #cbd5e1;
            vertical-align: middle;
        }

        .table-thumb {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            display: block;
        }

        .td-name {
            font-weight: 800;
            color: #111827;
            font-size: 15px;
        }

        /* 학년 뱃지 */
        .grade-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }
        .grade-staff { background: #0f172a; color: #ffffff; }
        .grade-6 { background: #fee2e2; color: #991b1b; }
        .grade-5 { background: #fef3c7; color: #92400e; }
        .grade-4 { background: #e0e7ff; color: #3730a3; }
        .grade-3 { background: #dcfce7; color: #166534; }
        .grade-2 { background: #f3e8ff; color: #6b21a8; }
        .grade-1 { background: #e0f2fe; color: #0369a1; }

        /* 포지션 뱃지 */
        .pos-tag {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
        }
        .pos-staff-leader { background: #b45309; }
        .pos-staff-coach { background: #475569; }
        .pos-투수 { background: #c2410c; }
        .pos-포수 { background: #0f766e; }
        .pos-내야수 { background: #1d4ed8; }
        .pos-외야수 { background: #15803d; }

        .hidden-badge {
            display: inline-block;
            background: #64748b;
            color: #ffffff;
            font-size: 10px;
            font-weight: 700;
            padding: 1px 6px;
            border-radius: 4px;
            margin-left: 4px;
        }

        .text-private {
            color: #94a3b8;
            font-weight: 700;
            font-size: 12px;
        }

        .admin-private-badge {
            display: inline-block;
            background: #fee2e2;
            color: #ef4444;
            font-size: 10px;
            font-weight: 800;
            padding: 1px 4px;
            border-radius: 3px;
            margin-left: 3px;
            vertical-align: middle;
        }

        /* 이미지형 카드 그리드 */
        .roster-grid {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
            gap: 14px;
        }

        .player-card {
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            transition: transform 0.15s, box-shadow 0.15s;
            position: relative;
            cursor: pointer;
        }

        .player-card.is-hidden {
            opacity: 0.65;
            border-color: #cbd5e1;
            background: #f8fafc;
        }

        .card-photo-box {
            width: 100%;
            aspect-ratio: 1 / 1.05;
            background: #e2e8f0;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            display: block;
        }

        .card-no-badge {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(11, 34, 64, 0.92);
            color: #ffffff;
            font-size: 12px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.4px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            z-index: 2;
        }

        .card-pos {
            position: absolute;
            top: 8px;
            right: 8px;
            z-index: 2;
        }

        .card-info {
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-name-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-name {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-title);
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .card-name-no {
            color: var(--kbo-red);
            font-size: 15px;
            font-weight: 800;
            letter-spacing: -0.2px;
        }

        .card-meta {
            font-size: 12px;
            color: var(--text-sub);
        }

        .card-extra {
            font-size: 11px;
            color: #64748b;
            background: #f8fafc;
            border-radius: 6px;
            padding: 5px 6px;
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            border: 1px solid #f1f5f9;
        }

        /* 로그인 모달 */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-content {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-header { font-size: 18px; font-weight: 800; margin-bottom: 16px; }
        .form-group { margin-bottom: 11px; display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 12px; font-weight: 700; color: #475569; }
        .form-group input { padding: 9px 12px; border: 1px solid var(--card-border); border-radius: 6px; font-size: 14px; outline: none; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
        .btn-cancel { background: #f1f5f9; border: 1px solid var(--card-border); padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; }
        .btn-save { background: var(--kbo-blue); color: #ffffff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; }

        .loading-notice {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-sub);
            font-size: 14px;
        }

        @media (max-width: 600px) {
            header { padding: 22px 14px; }
            .header-title { font-size: 21px; }
            .control-top { flex-direction: column; align-items: stretch; }
            .control-right { justify-content: space-between; }
            .search-box input { width: 140px; }
            .roster-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-title">대연초 야구부 명단</div>
    <div class="header-subtitle" id="rosterCountText">선수단 데이터를 불러오는 중...</div>
    <button id="adminLoginBtn" class="admin-toggle-btn" onclick="openAdminModal()">🔒 관리자 로그인</button>
</header>

<div class="container">
    <div class="control-card">
        <div class="control-top">
            <div class="grade-filters" id="gradeFilters">
                <button class="filter-btn active" onclick="setGrade('all', this)">전체</button>
                <button class="filter-btn staff-tab" onclick="setGrade('staff', this)">코칭스태프</button>
                <button class="filter-btn" onclick="setGrade('6', this)">6학년</button>
                <button class="filter-btn" onclick="setGrade('5', this)">5학년</button>
                <button class="filter-btn" onclick="setGrade('4', this)">4학년</button>
                <button class="filter-btn" onclick="setGrade('3', this)">3학년</button>
                <button class="filter-btn" onclick="setGrade('2', this)">2학년</button>
                <button class="filter-btn" onclick="setGrade('1', this)">1학년</button>
            </div>

            <div class="control-right">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="이름 / 등번호 검색" oninput="render()">
                </div>
                <div class="view-switch">
                    <button class="view-btn" id="btnListView" onclick="switchView('list')">☰ 리스트형</button>
                    <button class="view-btn" id="btnCardView" onclick="switchView('card')">▦ 이미지형</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 등급별 관리자 안내 바 -->
    <div id="adminBar" class="admin-bar">
        <span id="adminRoleText" style="font-size: 13px; font-weight: 700;"></span>
        <button id="btnSheetLink" class="btn-sheet-link" style="display: none;" onclick="window.open(GOOGLE_SHEET_EDIT_URL, '_blank')">📊 구글 시트 편집창 열기</button>
    </div>

    <!-- 1. 리스트형 -->
    <div class="table-wrap" id="listContainer">
        <table>
            <thead>
                <tr>
                    <th style="width: 60px;">등번호</th>
                    <th style="width: 65px;">사진</th>
                    <th>성명</th>
                    <th>구분/학년</th>
                    <th>포지션/역할</th>
                    <th>투/타</th>
                    <th>생년월일</th>
                    <th>신장 / 체중</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- 2. 이미지형 -->
    <div class="roster-grid" id="cardContainer"></div>

    <div id="statusNotice" class="loading-notice">선수 명단을 실시간으로 불러오고 있습니다...</div>
</div>

<!-- 로그인 모달 -->
<div id="loginModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">관리자 등급 로그인</div>
        <div class="form-group">
            <label>관리자 비밀번호</label>
            <input type="password" id="adminPw" placeholder="비밀번호 입력">
            <span style="font-size: 11px; color: #64748b; line-height: 1.5; margin-top: 6px;">
                • <b>최고관리자 (9999)</b>: 숨김 선수 열람 + 모든 비공개 해제 + 시트 편집<br>
                • <b>보조관리자 (7777)</b>: 비공개 사진 및 체격 열람 + 시트 편집<br>
                • <b>일반관리자 (1111)</b>: 선수 비공개 체격(키/몸무게) 열람 전용
            </span>
        </div>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal('loginModal')">취소</button>
            <button class="btn-save" onclick="handleLogin()">로그인</button>
        </div>
    </div>
</div>

<script>
    const defaultAvatar = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23e2e8f0'/%3E%3Cpath d='M32 32 C32 18 42 12 50 12 C58 12 68 18 68 32 C68 40 58 48 50 48 C42 48 32 40 32 32 Z' fill='%2394a3b8'/%3E%3Cpath d='M44 14 C48 10 56 10 65 14 C74 18 84 18 86 21 C86 24 75 25 65 24 Z' fill='%230b2240'/%3E%3Cpath d='M20 92 C20 66 34 56 50 56 C66 56 80 66 80 92 Z' fill='%2364748b'/%3E%3C/svg%3E";

    function handleImgError(el) {
        el.onerror = null;
        el.src = defaultAvatar;
    }

    let players = [];
    let selectedGrade = 'all';
    let currentView = localStorage.getItem('daeyeon_view_mode') || 'list';
    let currentRole = 'guest'; // 'guest', 'general', 'sub', 'super'

    function isStaff(grade) {
        return grade === '감독' || grade === '코치';
    }

    function getGradeBadge(grade) {
        if (isStaff(grade)) return `<span class="grade-tag grade-staff">${grade}</span>`;
        return `<span class="grade-tag grade-${grade}">${grade}학년</span>`;
    }

    function getPosBadge(pos, grade) {
        if (!pos || pos === '-') return '-';
        if (grade === '감독') return `<span class="pos-tag pos-staff-leader">${pos}</span>`;
        if (grade === '코치') return `<span class="pos-tag pos-staff-coach">${pos}</span>`;
        return `<span class="pos-tag pos-${pos}">${pos}</span>`;
    }

    // 신장/체중 권한별 마스킹 함수
    function formatPhys(p) {
        const h = p.height;
        const w = p.weight;
        if (!h && !w) return '-';

        const hHidden = !!p.hideHeight;
        const wHidden = !!p.hideWeight;

        // 체격 열람 권한: 일반관리자 이상 (general, sub, super) 모두 가능
        const canViewPhys = (currentRole === 'general' || currentRole === 'sub' || currentRole === 'super');

        if (!canViewPhys) {
            // 일반 방문자 (guest): 비공개 시 마스킹
            if (hHidden && wHidden) return '<span class="text-private">비공개</span>';
            const hStr = h ? (hHidden ? '<span class="text-private">비공개</span>' : `${h}cm`) : '-';
            const wStr = w ? (wHidden ? '<span class="text-private">비공개</span>' : `${w}kg`) : '-';
            return `${hStr} / ${wStr}`;
        } else {
            // 관리자 등급: 실제 수치 노출 (비공개된 항목은 뱃지 표시)
            const showBadge = (currentRole === 'super' || currentRole === 'sub');
            const hBadge = (hHidden && showBadge) ? '<span class="admin-private-badge">비공개</span>' : '';
            const wBadge = (wHidden && showBadge) ? '<span class="admin-private-badge">비공개</span>' : '';
            const hStr = h ? `${h}cm${hBadge}` : '-';
            const wStr = w ? `${w}kg${wBadge}` : '-';
            return `${hStr} / ${wStr}`;
        }
    }

    function switchView(view) {
        currentView = view;
        localStorage.setItem('daeyeon_view_mode', view);

        const btnList = document.getElementById('btnListView');
        const btnCard = document.getElementById('btnCardView');
        const listContainer = document.getElementById('listContainer');
        const cardContainer = document.getElementById('cardContainer');

        if (view === 'list') {
            btnList.classList.add('active');
            btnCard.classList.remove('active');
            listContainer.style.display = 'block';
            cardContainer.style.display = 'none';
        } else {
            btnList.classList.remove('active');
            btnCard.classList.add('active');
            listContainer.style.display = 'none';
            cardContainer.style.display = 'grid';
        }
        render();
    }

    function setGrade(grade, btn) {
        selectedGrade = grade;
        document.querySelectorAll('#gradeFilters .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    function goToPlayer(path) {
        window.location.href = `player.html?path=${encodeURIComponent(path)}`;
    }

    function render() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const tableBody = document.getElementById('tableBody');
        const cardContainer = document.getElementById('cardContainer');
        const notice = document.getElementById('statusNotice');

        // 사진 비공개 해제 권한: 보조관리자(sub) 및 최고관리자(super)만 가능
        const canViewPhoto = (currentRole === 'sub' || currentRole === 'super');

        const filtered = players.filter(p => {
            const isVisible = (p.visible !== false);
            // 숨김 선수 열람 권한: 오직 최고관리자(super)만 가능
            if (currentRole !== 'super' && !isVisible) return false;

            let matchGrade = false;
            if (selectedGrade === 'all') matchGrade = true;
            else if (selectedGrade === 'staff') matchGrade = isStaff(p.grade);
            else matchGrade = (p.grade.toString() === selectedGrade);

            const matchSearch = p.name.toLowerCase().includes(query) || 
                                p.no.toString().includes(query) || 
                                (p.pos && p.pos.includes(query));
            return matchGrade && matchSearch;
        }).sort((a, b) => {
            const rankA = a.grade === '감독' ? 1 : (a.grade === '코치' ? 2 : 3);
            const rankB = b.grade === '감독' ? 1 : (b.grade === '코치' ? 2 : 3);
            if (rankA !== rankB) return rankA - rankB;
            return a.no - b.no;
        });

        const activeStaff = players.filter(p => isStaff(p.grade) && (currentRole === 'super' || p.visible !== false)).length;
        const activeStudent = players.filter(p => !isStaff(p.grade) && (currentRole === 'super' || p.visible !== false)).length;
        document.getElementById('rosterCountText').textContent = `2026 OFFICIAL ROSTER (코칭스태프 ${activeStaff}명 · 등록선수 ${activeStudent}명)`;

        if (filtered.length === 0) {
            tableBody.innerHTML = '';
            cardContainer.innerHTML = '';
            notice.textContent = '조건에 맞는 명단이 없습니다.';
            notice.style.display = 'block';
            return;
        }
        notice.style.display = 'none';

        // 1. [리스트형] 렌더링
        tableBody.innerHTML = filtered.map(p => {
            const photoUrl = `data/photos/${p.no}.jpg`;
            const isHidden = (p.visible === false);
            const hiddenBadge = isHidden ? `<span class="hidden-badge">숨김</span>` : '';
            const playerPath = isStaff(p.grade) ? `staff/${p.no}` : `${p.grade}/${p.no}`;

            let photoCell = '';
            if (p.hidePhoto && !canViewPhoto) {
                // 사진 비공개 상태 (일반인, 일반관리자)
                photoCell = `
                    <div class="table-thumb-wrap" style="background: #f1f5f9;" title="사진 비공개">
                        <span style="font-size: 15px; opacity: 0.6;">🔒</span>
                    </div>
                `;
            } else {
                // 사진 열람 가능 (보조/최고관리자 또는 원래 공개된 사진)
                const adminPhotoBadge = (p.hidePhoto && canViewPhoto) ? `<span class="admin-private-badge" style="position:absolute; bottom:0; left:50%; transform:translateX(-50%); font-size:9px; white-space:nowrap;">비공개</span>` : '';
                photoCell = `
                    <div class="table-thumb-wrap" style="position: relative;">
                        <img class="table-thumb" src="${photoUrl}" alt="" onerror="handleImgError(this)">
                        ${adminPhotoBadge}
                    </div>
                `;
            }

            return `
                <tr class="clickable-row ${isHidden ? 'is-hidden' : ''}" onclick="goToPlayer('${playerPath}')">
                    <td class="td-no">${p.no}</td>
                    <td>${photoCell}</td>
                    <td class="td-name">${p.name}${hiddenBadge}</td>
                    <td>${getGradeBadge(p.grade)}</td>
                    <td>${getPosBadge(p.pos, p.grade)}</td>
                    <td style="color: #64748b;">${p.bt || '-'}</td>
                    <td style="color: #475569; font-size: 13px;">${p.birth || '-'}</td>
                    <td style="color: #475569; font-size: 13px;">${formatPhys(p)}</td>
                </tr>
            `;
        }).join('');

        // 2. [이미지형] 렌더링
        cardContainer.innerHTML = filtered.map(p => {
            const photoUrl = `data/photos/${p.no}.jpg`;
            const isHidden = (p.visible === false);
            const hiddenBadge = isHidden ? `<span class="hidden-badge">숨김</span>` : '';
            const posBadge = (p.pos && p.pos !== '-') ? getPosBadge(p.pos, p.grade) : '';
            const extraMeta = isStaff(p.grade) ? (p.bt && p.bt !== '-' ? p.bt : '지도자') : (p.bt || '우투우타');
            const playerPath = isStaff(p.grade) ? `staff/${p.no}` : `${p.grade}/${p.no}`;

            let cardPhotoHtml = '';
            if (p.hidePhoto && !canViewPhoto) {
                // 사진 비공개 상태
                cardPhotoHtml = `
                    <div class="card-photo-box" style="background:#f1f5f9; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                        <span class="card-no-badge">No.${p.no}</span>
                        <div class="card-pos">${posBadge}</div>
                        <div style="font-size:32px; opacity:0.35;">👤</div>
                        <span style="margin-top:6px; font-size:11px; font-weight:800; color:#64748b; background:rgba(255,255,255,0.9); padding:3px 8px; border-radius:12px; border:1px solid #cbd5e1;">🔒 사진 비공개</span>
                    </div>
                `;
            } else {
                // 사진 열람 가능 상태
                const adminPhotoBadge = (p.hidePhoto && canViewPhoto) ? `<span style="position:absolute; bottom:8px; left:8px; background:#ef4444; color:#ffffff; font-size:10px; font-weight:800; padding:2px 6px; border-radius:4px; z-index:3;">🔒 사진 비공개</span>` : '';
                cardPhotoHtml = `
                    <div class="card-photo-box">
                        <span class="card-no-badge">No.${p.no}</span>
                        <div class="card-pos">${posBadge}</div>
                        <img class="card-img" src="${photoUrl}" alt="" onerror="handleImgError(this)">
                        ${adminPhotoBadge}
                    </div>
                `;
            }

            return `
                <div class="player-card ${isHidden ? 'is-hidden' : ''}" onclick="goToPlayer('${playerPath}')">
                    ${cardPhotoHtml}
                    <div class="card-info">
                        <div class="card-name-row">
                            <span class="card-name"><span class="card-name-no">No.${p.no}</span> ${p.name}${hiddenBadge}</span>
                            ${getGradeBadge(p.grade)}
                        </div>
                        <div class="card-meta">${extraMeta}</div>
                        <div class="card-extra">
                            <div>🎂 ${p.birth || '-'}</div>
                            <div>📏 ${formatPhys(p)}</div>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function openAdminModal() {
        if (currentRole !== 'guest') {
            if (confirm('관리자 모드를 로그아웃 하시겠습니까?')) {
                currentRole = 'guest';
                updateAdminUI();
                render();
            }
        } else {
            document.getElementById('adminPw').value = '';
            document.getElementById('loginModal').style.display = 'flex';
        }
    }

    function handleLogin() {
        const pw = document.getElementById('adminPw').value.trim();
        if (pw === '9999') {
            currentRole = 'super';
            alert('👑 최고관리자로 로그인되었습니다.\n(숨김 선수 및 모든 비공개 데이터 열람 가능)');
        } else if (pw === '7777') {
            currentRole = 'sub';
            alert('🛠️ 보조관리자로 로그인되었습니다.\n(비공개 사진 및 체격 스펙 열람 가능)');
        } else if (pw === '1111') {
            currentRole = 'general';
            alert('📋 일반관리자로 로그인되었습니다.\n(선수 비공개 체격 스펙 열람 가능)');
        } else {
            alert('비밀번호가 올바르지 않습니다.');
            return;
        }

        closeModal('loginModal');
        updateAdminUI();
        render();
    }

    function updateAdminUI() {
        const adminBar = document.getElementById('adminBar');
        const adminBtn = document.getElementById('adminLoginBtn');
        const roleText = document.getElementById('adminRoleText');
        const btnSheetLink = document.getElementById('btnSheetLink');

        adminBar.className = 'admin-bar';

        if (currentRole === 'super') {
            adminBtn.textContent = '🔓 최고관리자 로그아웃';
            adminBtn.classList.add('logged-in');
            adminBar.classList.add('super');
            adminBar.style.display = 'flex';
            roleText.textContent = '👑 최고관리자 모드 (숨김 선수 & 모든 비공개 열람 중)';
            btnSheetLink.style.display = 'inline-flex';
        } else if (currentRole === 'sub') {
            adminBtn.textContent = '🔓 보조관리자 로그아웃';
            adminBtn.classList.add('logged-in');
            adminBar.classList.add('sub');
            adminBar.style.display = 'flex';
            roleText.textContent = '🛠️ 보조관리자 모드 (비공개 사진 & 체격 열람 중)';
            btnSheetLink.style.display = 'inline-flex';
        } else if (currentRole === 'general') {
            adminBtn.textContent = '🔓 일반관리자 로그아웃';
            adminBtn.classList.add('logged-in');
            adminBar.classList.add('general');
            adminBar.style.display = 'flex';
            roleText.textContent = '📋 일반관리자 모드 (체격 스펙 열람 전용)';
            btnSheetLink.style.display = 'none';
        } else {
            adminBtn.textContent = '🔒 관리자 로그인';
            adminBtn.classList.remove('logged-in');
            adminBar.style.display = 'none';
            btnSheetLink.style.display = 'none';
        }
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
    }

    // 구글 스프레드시트 실시간 데이터 로드
    async function loadGoogleSheetData() {
        try {
            const cacheUrl = GOOGLE_SHEET_CSV_URL + (GOOGLE_SHEET_CSV_URL.includes('?') ? '&' : '?') + 'nocache=' + new Date().getTime();
            const response = await fetch(cacheUrl);
            const csvText = await response.text();

            Papa.parse(csvText, {
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    players = results.data.map((row, idx) => ({
                        id: idx + 1,
                        no: parseInt(row['등번호']) || 0,
                        name: (row['이름'] || '').trim(),
                        grade: (row['구분'] || '').trim(),
                        pos: (row['포지션'] || '-').trim(),
                        bt: (row['투타'] || '-').trim(),
                        birth: (row['생년월일'] || '').trim(),
                        height: (row['키'] || '').trim(),
                        weight: (row['몸무게'] || '').trim(),
                        visible: String(row['노출여부'] || '').toUpperCase().trim() !== 'OFF',
                        hidePhoto: ['O', 'Y', 'TRUE', '1'].includes(String(row['사진비공개'] || '').toUpperCase().trim()),
                        hideHeight: ['O', 'Y', 'TRUE', '1'].includes(String(row['키비공개'] || '').toUpperCase().trim()),
                        hideWeight: ['O', 'Y', 'TRUE', '1'].includes(String(row['몸무게비공개'] || '').toUpperCase().trim())
                    })).filter(p => p.no && p.name);

                    switchView(currentView);
                }
            });
        } catch (error) {
            console.error("데이터 로드 에러:", error);
            document.getElementById('statusNotice').textContent = "구글 시트 데이터를 불러오는 데 실패했습니다.";
        }
    }

    // 초기 실행
    loadGoogleSheetData();
</script>
