<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대연초등학교 야구부 공식 선수단</title>
    <style>
        :root {
            --kbo-blue: #0b2240;
            --kbo-sub-blue: #163868;
            --kbo-red: #c8102e;
            --bg-gray: #f4f6f9;
            --card-border: #e2e8f0;
            --text-title: #0f172a;
            --text-sub: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-gray);
            color: var(--text-title);
            padding-bottom: 70px;
        }

        /* 1. KBO 헤더 */
        header {
            background-color: var(--kbo-blue);
            color: white;
            padding: 30px 20px 25px;
            text-align: center;
            border-bottom: 5px solid var(--kbo-red);
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .header-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .header-subtitle {
            font-size: 13px;
            color: #cbd5e1;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .admin-toggle-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }

        .admin-toggle-btn:hover {
            background: rgba(255,255,255,0.25);
        }

        .admin-toggle-btn.logged-in {
            background: #fee2e2;
            color: var(--kbo-red);
            border-color: #fca5a5;
        }

        /* 메인 레이아웃 */
        .container {
            max-width: 1040px;
            margin: 20px auto 0;
            padding: 0 16px;
        }

        /* 2. 컨트롤 패널 */
        .control-card {
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .control-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }

        .grade-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .filter-btn {
            background: #ffffff;
            border: 1px solid #d1d5db;
            color: #4b5563;
            padding: 6px 13px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }

        .filter-btn:hover {
            background: #f3f4f6;
        }

        .filter-btn.active {
            background: var(--kbo-blue);
            color: #ffffff;
            border-color: var(--kbo-blue);
            font-weight: 700;
        }

        .filter-btn.staff-tab.active {
            background: #1e293b;
            border-color: #1e293b;
        }

        .control-right {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .search-box input {
            padding: 7px 12px;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            font-size: 13px;
            width: 170px;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--kbo-blue);
        }

        .view-switch {
            display: flex;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            overflow: hidden;
        }

        .view-btn {
            background: #ffffff;
            border: none;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 700;
            color: #6b7280;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: 0.15s;
        }

        .view-btn.active {
            background: var(--kbo-sub-blue);
            color: #ffffff;
        }

        /* 최고관리자 액션 바 */
        .admin-bar {
            display: none;
            background: #eff6ff;
            border: 1px solid #bfdbfe;
            border-radius: 8px;
            padding: 10px 14px;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }

        .btn-add {
            background: #2563eb;
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-export {
            background: #059669;
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        /* 3. [리스트형] KBO 테이블 */
        .table-wrap {
            background: #ffffff;
            border-radius: 8px;
            border: 1px solid var(--card-border);
            overflow-x: auto;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 14px;
            min-width: 700px;
        }

        th {
            background-color: #f8fafc;
            color: #475569;
            font-weight: 700;
            padding: 13px 10px;
            font-size: 13px;
            border-bottom: 2px solid #e2e8f0;
            white-space: nowrap;
        }

        td {
            padding: 12px 10px;
            border-bottom: 1px solid #edf2f7;
            vertical-align: middle;
        }

        tr:hover td {
            background-color: #f8fafc;
        }

        .td-no {
            font-weight: 900;
            color: var(--kbo-blue);
            font-size: 16px;
        }

        .td-name {
            font-weight: 800;
            color: #111827;
            font-size: 15px;
        }

        /* 학년 및 코칭스태프 뱃지 */
        .grade-tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
        }
        .grade-staff { background: #0f172a; color: #ffffff; }
        .grade-6 { background: #fee2e2; color: #991b1b; }
        .grade-5 { background: #fef3c7; color: #92400e; }
        .grade-4 { background: #e0e7ff; color: #3730a3; }
        .grade-3 { background: #dcfce7; color: #166534; }
        .grade-2 { background: #f3e8ff; color: #6b21a8; }

        /* 포지션 뱃지 */
        .pos-tag {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 700;
            color: #ffffff;
        }
        .pos-staff-leader { background: #b45309; }  /* 감독 */
        .pos-staff-coach { background: #475569; }   /* 코치 */
        .pos-투수 { background: #c2410c; }
        .pos-포수 { background: #0f766e; }
        .pos-내야수 { background: #1d4ed8; }
        .pos-외야수 { background: #15803d; }
        .pos-기타 { background: #64748b; }

        /* 4. [이미지형] 카드 그리드 */
        .roster-grid {
            display: none;
            grid-template-columns: repeat(auto-fill, minmax(175px, 1fr));
            gap: 14px;
        }

        .player-card {
            background: #ffffff;
            border: 1px solid var(--card-border);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            transition: transform 0.15s;
        }

        .player-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.06);
        }

        .card-photo-box {
            width: 100%;
            aspect-ratio: 1 / 1.05;
            background: #e2e8f0;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
        }

        .card-no {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(11, 34, 64, 0.9);
            color: #ffffff;
            font-size: 13px;
            font-weight: 900;
            padding: 2px 7px;
            border-radius: 5px;
            font-family: "Impact", sans-serif;
        }

        .card-pos {
            position: absolute;
            top: 8px;
            right: 8px;
        }

        .card-info {
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-name-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-name {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-title);
        }

        .card-meta {
            font-size: 12px;
            color: var(--text-sub);
        }

        .card-extra {
            font-size: 11px;
            color: #64748b;
            background: #f8fafc;
            border-radius: 6px;
            padding: 5px 6px;
            margin-top: 4px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            border: 1px solid #f1f5f9;
        }

        /* 관리자 수정/삭제 버튼 */
        .btn-table-edit { padding: 4px 8px; border: 1px solid #cbd5e1; background: #ffffff; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; }
        .btn-table-del { padding: 4px 8px; border: 1px solid #fca5a5; background: #fee2e2; color: #b91c1c; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; margin-left: 4px; }

        .card-admin-bar {
            display: none;
            padding: 8px 10px;
            border-top: 1px dashed var(--card-border);
            gap: 6px;
            background: #fafafa;
        }
        .card-admin-bar button { flex: 1; padding: 5px 0; border-radius: 4px; font-size: 11px; font-weight: 700; cursor: pointer; }
        .btn-card-edit { background: #f1f5f9; border: 1px solid #cbd5e1; }
        .btn-card-del { background: #fee2e2; border: 1px solid #fca5a5; color: #b91c1c; }

        /* 모달 팝업 */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 999;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .modal-content {
            background: #ffffff;
            width: 100%;
            max-width: 440px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 12px;
            padding: 22px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .modal-header { font-size: 18px; font-weight: 800; margin-bottom: 16px; }
        .form-group { margin-bottom: 11px; display: flex; flex-direction: column; gap: 4px; }
        .form-row { display: flex; gap: 8px; }
        .form-group label { font-size: 12px; font-weight: 700; color: #475569; }
        .form-group input, .form-group select { padding: 9px 12px; border: 1px solid var(--card-border); border-radius: 6px; font-size: 14px; outline: none; }
        .modal-btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
        .btn-cancel { background: #f1f5f9; border: 1px solid var(--card-border); padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; }
        .btn-save { background: var(--kbo-blue); color: #ffffff; border: none; padding: 8px 16px; border-radius: 6px; font-weight: 700; cursor: pointer; }

        .no-data {
            text-align: center;
            padding: 40px;
            color: var(--text-sub);
            font-size: 14px;
        }

        @media (max-width: 600px) {
            header { padding: 22px 14px; }
            .header-title { font-size: 21px; }
            .control-top { flex-direction: column; align-items: stretch; }
            .control-right { justify-content: space-between; }
            .search-box input { width: 140px; }
            .roster-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-title">대연초등학교 야구부</div>
    <div class="header-subtitle" id="rosterCountText">2026 OFFICIAL ROSTER</div>
    <button id="adminLoginBtn" class="admin-toggle-btn" onclick="openAdminModal()">🔒 관리자 로그인</button>
</header>

<div class="container">
    <div class="control-card">
        <div class="control-top">
            <!-- 구분 필터 (코칭스태프 탭 추가) -->
            <div class="grade-filters" id="gradeFilters">
                <button class="filter-btn active" onclick="setGrade('all', this)">전체</button>
                <button class="filter-btn staff-tab" onclick="setGrade('staff', this)">코칭스태프</button>
                <button class="filter-btn" onclick="setGrade('6', this)">6학년</button>
                <button class="filter-btn" onclick="setGrade('5', this)">5학년</button>
                <button class="filter-btn" onclick="setGrade('4', this)">4학년</button>
                <button class="filter-btn" onclick="setGrade('3', this)">3학년</button>
                <button class="filter-btn" onclick="setGrade('2', this)">2학년</button>
            </div>

            <div class="control-right">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="이름 / 등번호 검색" oninput="render()">
                </div>
                <div class="view-switch">
                    <button class="view-btn active" id="btnListView" onclick="switchView('list')">☰ 리스트형</button>
                    <button class="view-btn" id="btnCardView" onclick="switchView('card')">▦ 이미지형</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 최고관리자 모드 전용 액션 바 -->
    <div id="adminBar" class="admin-bar">
        <span style="font-size: 13px; font-weight: 700; color: #1e40af;">🔧 최고관리자 모드 실행 중</span>
        <div style="display: flex; gap: 6px;">
            <button class="btn-add" onclick="openPlayerModal()">+ 등록 (지도자/선수)</button>
            <button class="btn-export" onclick="exportUpdatedHTML()" title="수정된 전체 소스코드를 다운로드">💾 HTML 내보내기</button>
        </div>
    </div>

    <!-- 1. 리스트형 (테이블) -->
    <div class="table-wrap" id="listContainer">
        <table>
            <thead>
                <tr>
                    <th style="width: 60px;">등번호</th>
                    <th>성명</th>
                    <th>구분/학년</th>
                    <th>포지션/역할</th>
                    <th>투/타</th>
                    <th>생년월일</th>
                    <th>신장 / 체중</th>
                    <th id="thAdmin" style="display: none; width: 110px;">관리</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <!-- 2. 이미지형 (카드 그리드) -->
    <div class="roster-grid" id="cardContainer"></div>

    <div id="noDataNotice" class="no-data" style="display: none;">검색 조건에 맞는 명단이 없습니다.</div>
</div>

<!-- 로그인 모달 -->
<div id="loginModal" class="modal">
    <div class="modal-content" style="max-width: 360px;">
        <div class="modal-header">최고관리자 로그인</div>
        <div class="form-group">
            <label>관리자 비밀번호</label>
            <input type="password" id="adminPw" placeholder="기본 비밀번호: 1234">
        </div>
        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal('loginModal')">취소</button>
            <button class="btn-save" onclick="handleLogin()">로그인</button>
        </div>
    </div>
</div>

<!-- 지도자 / 선수 등록 및 수정 모달 -->
<div id="playerModal" class="modal">
    <div class="modal-content">
        <div class="modal-header" id="playerModalTitle">명단 정보 등록</div>
        <input type="hidden" id="editPlayerId">
        
        <div class="form-row">
            <div class="form-group" style="flex: 1;">
                <label>등번호</label>
                <input type="number" id="inpNo" required placeholder="예: 70">
            </div>
            <div class="form-group" style="flex: 2;">
                <label>이름</label>
                <input type="text" id="inpName" required placeholder="예: 홍길동">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group" style="flex: 1;">
                <label>구분 / 학년</label>
                <select id="inpGrade">
                    <optgroup label="코칭스태프">
                        <option value="감독">감독</option>
                        <option value="코치">코치</option>
                    </optgroup>
                    <optgroup label="선수단 (학년)">
                        <option value="6">6학년</option>
                        <option value="5" selected>5학년</option>
                        <option value="4">4학년</option>
                        <option value="3">3학년</option>
                        <option value="2">2학년</option>
                    </optgroup>
                </select>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>포지션 / 역할</label>
                <select id="inpPos">
                    <optgroup label="지도자 역할">
                        <option value="총괄/지휘">총괄/지휘</option>
                        <option value="수석코치">수석코치</option>
                        <option value="투수코치">투수코치</option>
                        <option value="야수코치">야수코치</option>
                        <option value="타격코치">타격코치</option>
                    </optgroup>
                    <optgroup label="선수 포지션">
                        <option value="-">- 미정 -</option>
                        <option value="투수">투수</option>
                        <option value="포수">포수</option>
                        <option value="내야수">내야수</option>
                        <option value="외야수">외야수</option>
                    </optgroup>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>투/타 유형</label>
            <select id="inpBt">
                <option value="-">- 미정 -</option>
                <option value="우투우타">우투우타</option>
                <option value="좌투좌타">좌투좌타</option>
                <option value="우투좌타">우투좌타</option>
                <option value="좌투우타">좌투우타</option>
            </select>
        </div>

        <div class="form-group">
            <label>생년월일</label>
            <input type="text" id="inpBirth" placeholder="예: 1985.03.15 또는 2014.05.12">
        </div>

        <div class="form-row">
            <div class="form-group" style="flex: 1;">
                <label>신장 (키 cm)</label>
                <input type="number" id="inpHeight" placeholder="예: 178">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>체중 (몸무게 kg)</label>
                <input type="number" id="inpWeight" placeholder="예: 80">
            </div>
        </div>

        <div class="form-group">
            <label>프로필 사진</label>
            <input type="file" id="inpPhotoFile" accept="image/*" onchange="processImageFile(event)">
            <input type="hidden" id="inpPhotoBase64">
        </div>

        <div class="modal-btns">
            <button class="btn-cancel" onclick="closeModal('playerModal')">취소</button>
            <button class="btn-save" onclick="savePlayer()">저장하기</button>
        </div>
    </div>
</div>

<script>
    const defaultAvatar = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23e2e8f0'/%3E%3Cpath d='M32 32 C32 18 42 12 50 12 C58 12 68 18 68 32 C68 40 58 48 50 48 C42 48 32 40 32 32 Z' fill='%2394a3b8'/%3E%3Cpath d='M44 14 C48 10 56 10 65 14 C74 18 84 18 86 21 C86 24 75 25 65 24 Z' fill='%230b2240'/%3E%3Cpath d='M20 92 C20 66 34 56 50 56 C66 56 80 66 80 92 Z' fill='%2364748b'/%3E%3C/svg%3E";

    // 코칭스태프 2인 + 38명 선수단 초기 데이터
    const initialPlayers = [
        // 코칭스태프 (관리자 모드에서 수정 가능)
        { id: 101, no: 70, name: "감독님", grade: "감독", pos: "총괄/지휘", bt: "-", birth: "", height: "", weight: "", photo: "" },
        { id: 102, no: 71, name: "코치님", grade: "코치", pos: "수석코치", bt: "-", birth: "", height: "", weight: "", photo: "" },

        // 선수단 (38명)

    let players = JSON.parse(localStorage.getItem('daeyeon_players_v3')) || initialPlayers;
    let selectedGrade = 'all';
    let currentView = 'list';
    let isAdmin = false;

    function saveToStorage() {
        localStorage.setItem('daeyeon_players_v3', JSON.stringify(players));
    }

    function isStaff(grade) {
        return grade === '감독' || grade === '코치';
    }

    function getGradeBadge(grade) {
        if (isStaff(grade)) {
            return `<span class="grade-tag grade-staff">${grade}</span>`;
        }
        return `<span class="grade-tag grade-${grade}">${grade}학년</span>`;
    }

    function getPosBadge(pos, grade) {
        if (!pos || pos === '-') return '-';
        if (grade === '감독') return `<span class="pos-tag pos-staff-leader">${pos}</span>`;
        if (grade === '코치') return `<span class="pos-tag pos-staff-coach">${pos}</span>`;
        return `<span class="pos-tag pos-${pos}">${pos}</span>`;
    }

    function formatPhys(h, w) {
        if (h && w) return `${h}cm / ${w}kg`;
        if (h) return `${h}cm`;
        if (w) return `${w}kg`;
        return '-';
    }

    function switchView(view) {
        currentView = view;
        const btnList = document.getElementById('btnListView');
        const btnCard = document.getElementById('btnCardView');
        const listContainer = document.getElementById('listContainer');
        const cardContainer = document.getElementById('cardContainer');

        if (view === 'list') {
            btnList.classList.add('active');
            btnCard.classList.remove('active');
            listContainer.style.display = 'block';
            cardContainer.style.display = 'none';
        } else {
            btnList.classList.remove('active');
            btnCard.classList.add('active');
            listContainer.style.display = 'none';
            cardContainer.style.display = 'grid';
        }
        render();
    }

    function setGrade(grade, btn) {
        selectedGrade = grade;
        document.querySelectorAll('#gradeFilters .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        render();
    }

    function render() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        const tableBody = document.getElementById('tableBody');
        const cardContainer = document.getElementById('cardContainer');
        const thAdmin = document.getElementById('thAdmin');
        const noData = document.getElementById('noDataNotice');

        thAdmin.style.display = isAdmin ? 'table-cell' : 'none';

        // 필터링
        const filtered = players.filter(p => {
            let matchGrade = false;
            if (selectedGrade === 'all') {
                matchGrade = true;
            } else if (selectedGrade === 'staff') {
                matchGrade = isStaff(p.grade);
            } else {
                matchGrade = (p.grade.toString() === selectedGrade);
            }

            const matchSearch = p.name.toLowerCase().includes(query) || 
                                p.no.toString().includes(query) || 
                                (p.pos && p.pos.includes(query)) ||
                                (p.grade && p.grade.includes(query));
            return matchGrade && matchSearch;
        }).sort((a, b) => {
            // 정렬: 코칭스태프 우선(감독 > 코치), 이후 등번호 오름차순
            const rankA = a.grade === '감독' ? 1 : (a.grade === '코치' ? 2 : 3);
            const rankB = b.grade === '감독' ? 1 : (b.grade === '코치' ? 2 : 3);
            if (rankA !== rankB) return rankA - rankB;
            return a.no - b.no;
        });

        // 상단 인원 요약 갱신
        const staffCount = players.filter(p => isStaff(p.grade)).length;
        const studentCount = players.length - staffCount;
        document.getElementById('rosterCountText').textContent = `2026 OFFICIAL ROSTER (코칭스태프 ${staffCount}명 · 등록선수 ${studentCount}명)`;

        if (filtered.length === 0) {
            tableBody.innerHTML = '';
            cardContainer.innerHTML = '';
            noData.style.display = 'block';
            return;
        }
        noData.style.display = 'none';

        // 1. 리스트형 렌더링
        tableBody.innerHTML = filtered.map(p => {
            const posBadge = getPosBadge(p.pos, p.grade);
            const gradeBadge = getGradeBadge(p.grade);
            const physText = formatPhys(p.height, p.weight);
            const birthText = p.birth || '-';
            const adminCol = isAdmin ? `
                <td>
                    <button class="btn-table-edit" onclick="editPlayer(${p.id})">수정</button>
                    <button class="btn-table-del" onclick="deletePlayer(${p.id})">삭제</button>
                </td>
            ` : '';

            return `
                <tr>
                    <td class="td-no">${p.no}</td>
                    <td class="td-name">${p.name}</td>
                    <td>${gradeBadge}</td>
                    <td>${posBadge}</td>
                    <td style="color: #64748b;">${p.bt || '-'}</td>
                    <td style="color: #475569; font-size: 13px;">${birthText}</td>
                    <td style="color: #475569; font-size: 13px;">${physText}</td>
                    ${adminCol}
                </tr>
            `;
        }).join('');

        // 2. 이미지형 렌더링
        cardContainer.innerHTML = filtered.map(p => {
            const imgSrc = p.photo || defaultAvatar;
            const posBadge = (p.pos && p.pos !== '-') ? getPosBadge(p.pos, p.grade) : '';
            const gradeBadge = getGradeBadge(p.grade);
            const physText = formatPhys(p.height, p.weight);
            const birthText = p.birth || '-';
            const extraMeta = isStaff(p.grade) ? (p.bt && p.bt !== '-' ? p.bt : '지도자') : (p.bt || '우투우타');

            return `
                <div class="player-card">
                    <div class="card-photo-box">
                        <span class="card-no">${p.no}</span>
                        <div class="card-pos">${posBadge}</div>
                        <img class="card-img" src="${imgSrc}" alt="${p.name}" onerror="this.src='${defaultAvatar}';">
                    </div>
                    <div class="card-info">
                        <div class="card-name-row">
                            <span class="card-name">${p.name}</span>
                            ${gradeBadge}
                        </div>
                        <div class="card-meta">${extraMeta}</div>
                        <div class="card-extra">
                            <div>🎂 ${birthText}</div>
                            <div>📏 ${physText}</div>
                        </div>
                    </div>
                    <div class="card-admin-bar" style="display: ${isAdmin ? 'flex' : 'none'};">
                        <button class="btn-card-edit" onclick="editPlayer(${p.id})">수정</button>
                        <button class="btn-card-del" onclick="deletePlayer(${p.id})">삭제</button>
                    </div>
                </div>
            `;
        }).join('');
    }

    function processImageFile(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 380;
                let width = img.width;
                let height = img.height;

                if (width > MAX_WIDTH) {
                    height = Math.round((height * MAX_WIDTH) / width);
                    width = MAX_WIDTH;
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                document.getElementById('inpPhotoBase64').value = canvas.toDataURL('image/jpeg', 0.85);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function openAdminModal() {
        if (isAdmin) {
            if (confirm('최고관리자 모드를 로그아웃 하시겠습니까?')) {
                isAdmin = false;
                document.getElementById('adminLoginBtn').textContent = '🔒 관리자 로그인';
                document.getElementById('adminLoginBtn').classList.remove('logged-in');
                document.getElementById('adminBar').style.display = 'none';
                render();
            }
        } else {
            document.getElementById('adminPw').value = '';
            document.getElementById('loginModal').style.display = 'flex';
        }
    }

    function handleLogin() {
        const pw = document.getElementById('adminPw').value;
        if (pw === '1234') { // 기본 관리자 비밀번호
            isAdmin = true;
            closeModal('loginModal');
            document.getElementById('adminLoginBtn').textContent = '🔓 관리자 로그아웃';
            document.getElementById('adminLoginBtn').classList.add('logged-in');
            document.getElementById('adminBar').style.display = 'flex';
            render();
        } else {
            alert('비밀번호가 올바르지 않습니다. (기본 번호: 1234)');
        }
    }

    function openPlayerModal(isEdit = false) {
        document.getElementById('playerModalTitle').textContent = isEdit ? '명단 정보 수정' : '새 지도자 / 선수 등록';
        document.getElementById('playerModal').style.display = 'flex';
    }

    function editPlayer(id) {
        const p = players.find(x => x.id === id);
        if (!p) return;
        document.getElementById('editPlayerId').value = p.id;
        document.getElementById('inpNo').value = p.no;
        document.getElementById('inpName').value = p.name;
        document.getElementById('inpGrade').value = p.grade;
        document.getElementById('inpPos').value = p.pos || '-';
        document.getElementById('inpBt').value = p.bt || '-';
        document.getElementById('inpBirth').value = p.birth || '';
        document.getElementById('inpHeight').value = p.height || '';
        document.getElementById('inpWeight').value = p.weight || '';
        document.getElementById('inpPhotoBase64').value = p.photo || '';
        document.getElementById('inpPhotoFile').value = '';
        openPlayerModal(true);
    }

    function savePlayer() {
        const idVal = document.getElementById('editPlayerId').value;
        const no = parseInt(document.getElementById('inpNo').value);
        const name = document.getElementById('inpName').value.trim();
        const grade = document.getElementById('inpGrade').value;
        const pos = document.getElementById('inpPos').value;
        const bt = document.getElementById('inpBt').value;
        const birth = document.getElementById('inpBirth').value.trim();
        const height = document.getElementById('inpHeight').value.trim();
        const weight = document.getElementById('inpWeight').value.trim();
        const photo = document.getElementById('inpPhotoBase64').value;

        if (!no || !name) {
            alert('등번호와 성명을 입력해 주세요.');
            return;
        }

        if (idVal) {
            const idx = players.findIndex(x => x.id == idVal);
            if (idx !== -1) {
                players[idx] = { 
                    ...players[idx], 
                    no, name, grade, pos, bt, birth, height, weight,
                    photo: photo || players[idx].photo 
                };
            }
        } else {
            const newId = players.length > 0 ? Math.max(...players.map(p => p.id)) + 1 : 1;
            players.push({ id: newId, no, name, grade, pos, bt, birth, height, weight, photo });
        }

        saveToStorage();
        closeModal('playerModal');
        render();
    }

    function deletePlayer(id) {
        if (confirm('해당 항목을 명단에서 완전히 삭제하시겠습니까?')) {
            players = players.filter(p => p.id !== id);
            saveToStorage();
            render();
        }
    }

    function closeModal(id) {
        document.getElementById(id).style.display = 'none';
        if (id === 'playerModal') {
            document.getElementById('editPlayerId').value = '';
            document.getElementById('inpNo').value = '';
            document.getElementById('inpName').value = '';
            document.getElementById('inpBirth').value = '';
            document.getElementById('inpHeight').value = '';
            document.getElementById('inpWeight').value = '';
            document.getElementById('inpPhotoBase64').value = '';
            document.getElementById('inpPhotoFile').value = '';
        }
    }

    function exportUpdatedHTML() {
        const fullSource = document.documentElement.outerHTML;
        const jsonStr = JSON.stringify(players, null, 8);
        const regex = /const initialPlayers = \[[\s\S]*?\];/;
        const updatedSource = "<!DOCTYPE html>\n<html lang=\"ko\">\n" + fullSource.replace(regex, `const initialPlayers = ${jsonStr};`) + "\n</html>";

        const blob = new Blob([updatedSource], { type: 'text/html;charset=utf-8' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'index.html';
        a.click();
    }

    render();
